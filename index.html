teria cause about 80% of pediatric UTIs."},{"t":"Have her wear cotton underwear","c":true,"w":"Correct. Cotton reduces moisture and irritation."},{"t":"Encourage her to void often and not hold her urine","c":true,"w":"Correct. Holding urine causes stasis, which promotes bacterial growth."},{"t":"Avoid bubble baths","c":true,"w":"Correct. Bubble baths irritate the urethra and are a known risk factor in girls."}],"take":"Pediatric UTI prevention: hygiene, no bubble baths, frequent voiding, fluids, cotton underwear, and complete the antibiotics."},{"topic":"Pediatric UTI","unit":"Pediatric GU","type":"sata","cj":"Analyze Cues","stem":"The nurse reviews the histories of several children. Which children have an increased risk for UTI? Select all that apply.","opts":[{"t":"A school-age girl who often delays voiding","c":true,"w":"Correct. Holding urine causes urinary stasis."},{"t":"A circumcised 4-year-old boy with no urinary anomalies","c":false,"w":"Incorrect. Without anomalies, his risk is low. Boys' main risks are congenital anomalies and being uncircumcised in infancy."},{"t":"An uncircumcised 6-month-old boy","c":true,"w":"Correct. UTI incidence is higher in uncircumcised infant boys younger than 1 year."},{"t":"A child with vesicoureteral reflux","c":true,"w":"Correct. Reflux carries bladder urine back up toward the kidneys and leads to upper tract infection."},{"t":"A toddler who drinks plenty of water and voids regularly","c":false,"w":"Incorrect. Good hydration and regular voiding are protective."},{"t":"A sexually active adolescent girl","c":true,"w":"Correct. Sexual activity in adolescent girls is a risk factor."}],"take":"Pediatric UTI risks: short female urethra, uncircumcised infant boys, stasis, reflux, obstruction, and sexual activity in adolescent girls."},{"topic":"Pediatric UTI","unit":"Pediatric GU","type":"mc","cj":"Recognize Cues","stem":"A 3-year-old is in the second day of oral antibiotics for a febrile UTI. Which finding requires immediate follow-up?","opts":[{"t":"Voided four times in the past 8 hours","c":false,"w":"Incorrect. This is adequate output, and frequent voiding is encouraged."},{"t":"Temperature 103.1°F (39.5°C), HR 170/min, lethargy, and capillary refill of 4 seconds","c":true,"w":"Correct. These suggest urosepsis with poor perfusion. Preventing urosepsis is a primary goal of pediatric UTI management."},{"t":"A mild diaper rash","c":false,"w":"Incorrect. This needs skin care but is not urgent."},{"t":"Asking for juice and a snack","c":false,"w":"Incorrect. An improving appetite is a good sign."}],"take":"Goals of pediatric UTI care: clear the infection, find contributing factors, prevent urosepsis, and preserve kidney function."},{"topic":"Cryptorchidism","unit":"Pediatric GU","type":"sata","cj":"Analyze Cues","stem":"The parents of a 10-month-old with an undescended testis ask what could happen if it is not corrected. Which complications should the nurse include? Select all that apply.","opts":[{"t":"Decreased sperm production later in life","c":true,"w":"Correct. Body heat damages the testis and leads to low sperm counts at sexual maturity."},{"t":"Kidney failure","c":false,"w":"Incorrect. Cryptorchidism does not affect kidney function."},{"t":"Increased risk of testicular torsion","c":true,"w":"Correct. An undescended testis is at greater risk for torsion."},{"t":"Increased risk of testicular cancer","c":true,"w":"Correct. Cryptorchidism raises the risk of testicular cancer."},{"t":"Development of hypospadias","c":false,"w":"Incorrect. Hypospadias is a separate congenital defect present at birth. It does not develop later."},{"t":"Increased risk of injury to the testis","c":true,"w":"Correct. A testis in the inguinal canal is more exposed to trauma."}],"take":"Undescended testis risks: infertility, torsion, trauma, cancer. It is often associated with inguinal hernia."},{"topic":"Cryptorchidism","unit":"Pediatric GU","type":"mc","cj":"Take Action","stem":"During a newborn assessment, the nurse cannot palpate the right testis in the scrotum. Which action is most appropriate?","opts":[{"t":"Tell the parents that surgery will be needed right away","c":false,"w":"Incorrect. Many testes descend on their own in the first months of life, and surgery is not immediate."},{"t":"Document the finding as hypospadias","c":false,"w":"Incorrect. Hypospadias involves the position of the urethral meatus, not the testes."},{"t":"Apply a cool cloth to the scrotum to bring the testis down","c":false,"w":"Incorrect. Cold makes the testis retract further."},{"t":"Warm the hands and the room, then palpate gently from the inguinal canal toward the scrotum","c":true,"w":"Correct. Cold hands and a cool room trigger the cremasteric reflex, which pulls a normal testis upward. Examining warm helps tell a retractile testis from a truly undescended one."}],"take":"Examine for undescended testes with warm hands in a warm room. Cold and touch cause retraction."},{"topic":"Cryptorchidism","unit":"Pediatric GU","type":"mc","cj":"Evaluate Outcomes","stem":"The nurse teaches the parents of a toddler who had an orchiopexy. Which statement by a parent indicates a need for further teaching?","opts":[{"t":"“He can go back to riding his tricycle and wrestling with his brother tomorrow.”","c":true,"w":"Correct. Strenuous activity and straddle toys are restricted for about 2 weeks to protect the surgical site."},{"t":"“We'll check the incision for redness, swelling, or drainage.”","c":false,"w":"Incorrect. This is correct monitoring for infection."},{"t":"“We'll give him his pain medicine on schedule for the first day or two.”","c":false,"w":"Incorrect. This is correct. Scheduled analgesia keeps the child comfortable."},{"t":"“We'll keep the area clean and change his diaper often.”","c":false,"w":"Incorrect. This is correct. Good hygiene protects the incision."}],"take":"After orchiopexy: pain control, incision care, and no straddle toys or rough play for a couple of weeks."},{"topic":"Cryptorchidism","unit":"Pediatric GU","type":"sata","cj":"Analyze Cues","stem":"Which statements about cryptorchidism are accurate? Select all that apply.","opts":[{"t":"It is frequently associated with an inguinal hernia","c":true,"w":"Correct. The two often occur together."},{"t":"Many undescended testes descend on their own during the first months of life","c":true,"w":"Correct. This is why treatment is not started at birth."},{"t":"Testicular self-examination is unnecessary after a successful orchiopexy","c":false,"w":"Incorrect. Cancer risk remains, so self-examination is taught starting in adolescence."},{"t":"Human chorionic gonadotropin (hCG) may be given to induce descent","c":true,"w":"Correct. Hormone therapy is tried before surgery."},{"t":"Surgery is delayed until puberty so the testis can finish growing","c":false,"w":"Incorrect. Orchiopexy is done in infancy or the toddler years, well before puberty, to protect fertility."}],"take":"Cryptorchidism management: imaging to locate the testis, hCG to induce descent, then orchiopexy if it stays undescended."},{"topic":"Hypospadias & Epispadias","unit":"Pediatric GU","type":"mc","cj":"Recognize Cues","stem":"During a newborn assessment, the nurse finds the urinary meatus on the underside (ventral surface) of the penile shaft, and the penis curves downward. How should the nurse document this finding?","opts":[{"t":"Phimosis","c":false,"w":"Incorrect. Phimosis is a narrowed foreskin that cannot be retracted."},{"t":"Cryptorchidism","c":false,"w":"Incorrect. Cryptorchidism is an undescended testis."},{"t":"Hypospadias with chordee","c":true,"w":"Correct. A ventral meatus is hypospadias. The downward curvature is chordee, a fibrous band that bends the penis."},{"t":"Epispadias with chordee","c":false,"w":"Incorrect. In epispadias the meatus is on the upper (dorsal) surface."}],"take":"Hypo = below (ventral). Epi = above (dorsal). Hypospadias is more common."},{"topic":"Hypospadias & Epispadias","unit":"Pediatric GU","type":"mc","cj":"Take Action","stem":"The parents of a newborn with hypospadias ask to have him circumcised before discharge. Which response by the nurse is best?","opts":[{"t":"“Circumcision is part of the hypospadias repair, so it can be done today.”","c":false,"w":"Incorrect. Circumcision is not done before the repair."},{"t":"“Circumcision now will help prevent urinary tract infections until the repair.”","c":false,"w":"Incorrect. Circumcising removes tissue the surgeon may need."},{"t":"“Circumcision is only delayed for epispadias, not hypospadias.”","c":false,"w":"Incorrect. Circumcision is specifically avoided with hypospadias."},{"t":"“Circumcision is delayed because the foreskin may be needed for the surgical repair.”","c":true,"w":"Correct. Infants with hypospadias are not circumcised. The foreskin is often used to reconstruct the urethra."}],"take":"No circumcision for an infant with hypospadias. The foreskin is saved for the repair."},{"topic":"Hypospadias & Epispadias","unit":"Pediatric GU","type":"sata","cj":"Take Action","stem":"A 9-month-old has returned from hypospadias repair with a urethral stent draining into a double diaper. Which interventions should the nurse include? Select all that apply.","opts":[{"t":"A daily tub bath until the stent is removed","c":false,"w":"Incorrect. Tub baths are avoided until the stent is out. Sponge bathe instead."},{"t":"Avoid straddle toys","c":true,"w":"Correct. Straddle toys put pressure on the repair."},{"t":"Clamp the stent if urine leaks around it","c":false,"w":"Incorrect. Never clamp the stent. Report leakage or decreased drainage."},{"t":"Give oxybutynin as prescribed for bladder spasms","c":true,"w":"Correct. The stent can cause painful bladder spasms. Oxybutynin relaxes the bladder."},{"t":"Encourage oral fluids","c":true,"w":"Correct. Good hydration keeps urine flowing and the stent patent."},{"t":"Double diapering to protect the stent and keep urine separate from stool","c":true,"w":"Correct. The stent drains into the outer diaper, and stool stays in the inner one."}],"take":"After hypospadias repair: protect the stent, push fluids, manage bladder spasms, no tub baths or straddle toys."},{"topic":"Hypospadias & Epispadias","unit":"Pediatric GU","type":"sata","cj":"Analyze Cues","stem":"Which statements about surgical repair of hypospadias and epispadias are accurate? Select all that apply.","opts":[{"t":"Repair is usually done between 6 and 12 months of age","c":true,"w":"Correct. Early repair happens before toilet training and before the child is aware of body image."},{"t":"Surgery releases the chordee and moves the meatus to the tip of the penis","c":true,"w":"Correct. Repair includes releasing the chordee, lengthening the urethra, and repositioning the meatus."},{"t":"Epispadias is more common than hypospadias","c":false,"w":"Incorrect. Epispadias is less common."},{"t":"Goals include normal urinary function, normal sexual function, and improved appearance","c":true,"w":"Correct. The goals are being able to void standing with a straight stream, future sexual function, and appearance."},{"t":"Repair usually requires several stages over many years","c":false,"w":"Incorrect. Repair is usually done in one stage."},{"t":"Repair is delayed until school age so the child can take part in decisions","c":false,"w":"Incorrect. Waiting increases psychological effects on body image."}],"take":"Hypospadias repair: one stage at 6 to 12 months to release the chordee, lengthen the urethra, and place the meatus at the tip."},{"topic":"Hypospadias & Epispadias","unit":"Pediatric GU","type":"sata","cj":"Recognize Cues","stem":"The nurse is assessing a newborn boy. Which findings require referral for further evaluation? Select all that apply.","opts":[{"t":"Urinary meatus centered at the tip of the glans","c":false,"w":"Incorrect. This is the normal location."},{"t":"An empty scrotal sac on one side","c":true,"w":"Correct. A testis that cannot be palpated may be undescended."},{"t":"Urinary meatus on the upper (dorsal) surface of the penis","c":true,"w":"Correct. This is epispadias."},{"t":"A urine stream that sprays or is deflected","c":true,"w":"Correct. An altered stream suggests an abnormally placed meatus."},{"t":"Both testes palpable in the scrotum","c":false,"w":"Incorrect. This is a normal finding."},{"t":"Downward curvature of the penis","c":true,"w":"Correct. This is chordee, often seen with hypospadias."}],"take":"Newborn GU exam: meatus position, stream, curvature (chordee), and testes in the scrotum."},{"topic":"Renal A&P","unit":"Renal","type":"mc","cj":"Generate Solutions","stem":"A client with chronic kidney disease asks why calcitriol was prescribed. Which explanation by the nurse is accurate?","opts":[{"t":"“Calcitriol binds the phosphorus in the food you eat.”","c":false,"w":"Incorrect. That describes a phosphate binder such as calcium acetate or sevelamer."},{"t":"“Calcitriol signals your bone marrow to make more red blood cells.”","c":false,"w":"Incorrect. That describes erythropoietin (epoetin)."},{"t":"“Calcitriol helps your kidneys get rid of extra potassium.”","c":false,"w":"Incorrect. Calcitriol does not treat hyperkalemia."},{"t":"“Your kidneys can no longer change vitamin D into its active form, which your intestines need to absorb calcium.”","c":true,"w":"Correct. The kidneys activate vitamin D. Without it, calcium absorption falls, leading to hypocalcemia and bone loss."}],"take":"Kidney functions: fluid and electrolyte balance, waste removal, BP control (RAAS), erythropoietin, vitamin D activation, acid-base balance, drug excretion."},{"topic":"Renal A&P","unit":"Renal","type":"sata","cj":"Analyze Cues","stem":"A nursing student is reviewing nephron function before a clinical shift. Which statements are accurate? Select all that apply.","opts":[{"t":"The loop of Henle produces erythropoietin","c":false,"w":"Incorrect. Erythropoietin comes from interstitial cells in the renal cortex. The loop of Henle concentrates urine."},{"t":"ADH increases water reabsorption in the distal tubule and collecting ducts","c":true,"w":"Correct. ADH concentrates urine by making these segments permeable to water."},{"t":"Aldosterone acts on the distal tubule to reabsorb sodium and excrete potassium","c":true,"w":"Correct. This is the basis of aldosterone's effect on BP and potassium."},{"t":"The glomerulus filters blood, and protein and RBCs are normally too large to pass through","c":true,"w":"Correct. Protein or RBCs in the urine suggest glomerular damage."},{"t":"Glucose in the urine is normal because glucose is freely filtered","c":false,"w":"Incorrect. Filtered glucose is normally fully reabsorbed. Glycosuria is abnormal and suggests hyperglycemia."},{"t":"Most water and all filtered glucose are reabsorbed in the proximal convoluted tubule","c":true,"w":"Correct. The proximal tubule does most reabsorption."}],"take":"Nephron path: glomerulus → Bowman capsule → proximal tubule → loop of Henle → distal tubule → collecting duct."},{"topic":"Renal Assessment & Diagnostics","unit":"Renal","type":"sata","cj":"Take Action","stem":"A client is scheduled for a 24-hour urine collection for creatinine clearance starting at 0700. Which actions by the nurse are correct? Select all that apply.","opts":[{"t":"Restart the collection if any urine is accidentally discarded","c":true,"w":"Correct. A missed void makes the results inaccurate."},{"t":"Collect all urine for 24 hours, including a final void at 0700 the next day","c":true,"w":"Correct. The final void completes the 24-hour period."},{"t":"Have the client void at 0700, discard that urine, and note the time","c":true,"w":"Correct. The first void is urine made before the test started, so it is discarded."},{"t":"Skip one void if the client is sleeping and document the reason","c":false,"w":"Incorrect. Every void must be collected, or the test is invalid."},{"t":"Keep the collection container on ice or refrigerated","c":true,"w":"Correct. Cooling prevents bacterial growth and breakdown of the specimen."},{"t":"Save the 0700 void as the first specimen in the container","c":false,"w":"Incorrect. Saving the first void adds urine from before the test window."}],"take":"24-hour urine: discard the first void, collect everything including the last void, keep it cold, restart if any is missed. A serum creatinine is drawn too."},{"topic":"Renal Assessment & Diagnostics","unit":"Renal","type":"mc","cj":"Analyze Cues","stem":"A client has vomited for 3 days. Labs: BUN 42 mg/dL, serum creatinine 1.0 mg/dL. Urine specific gravity is 1.032, HR is 108/min, and mucous membranes are dry. How should the nurse interpret these findings?","opts":[{"t":"Stage 4 chronic kidney disease","c":false,"w":"Incorrect. Creatinine is normal, and CKD typically causes a fixed, low specific gravity."},{"t":"Chronic glomerulonephritis","c":false,"w":"Incorrect. Nothing points to glomerular disease such as proteinuria, hematuria, or a rising creatinine."},{"t":"Dehydration, with a high BUN to creatinine ratio","c":true,"w":"Correct. The ratio is about 42:1 (normal is 10:1 to 20:1). BUN rises with dehydration while creatinine stays normal, and the high specific gravity confirms concentrated urine."},{"t":"Fluid volume excess","c":false,"w":"Incorrect. Dry mucous membranes, tachycardia, and concentrated urine indicate a fluid deficit."}],"take":"BUN rises with dehydration, protein intake, and GI bleeding. Creatinine is the more specific marker of kidney function."},{"topic":"Renal Assessment & Diagnostics","unit":"Renal","type":"sata","cj":"Recognize Cues","stem":"A client is scheduled for a CT scan with IV contrast to rule out ureteral obstruction. Which findings should the nurse report to the provider before the procedure? Select all that apply.","opts":[{"t":"Serum potassium 4.2 mEq/L","c":false,"w":"Incorrect. This is within the normal range."},{"t":"Takes metformin for type 2 diabetes","c":true,"w":"Correct. Metformin with contrast carries a risk of lactic acidosis. It is usually held and restarted only after kidney function is confirmed stable."},{"t":"Developed hives after contrast dye during a previous scan","c":true,"w":"Correct. A prior contrast reaction may require premedication or a different study."},{"t":"Has been vomiting and unable to keep fluids down for 2 days","c":true,"w":"Correct. Dehydration increases the risk of contrast-induced kidney injury."},{"t":"BUN 14 mg/dL","c":false,"w":"Incorrect. This is within the normal range."},{"t":"Serum creatinine 2.4 mg/dL with an eGFR of 28 mL/min","c":true,"w":"Correct. Reduced kidney function raises the risk of contrast-induced kidney injury."}],"take":"Before IV contrast: check kidney function, hydration, metformin use, and prior contrast reactions."},{"topic":"Renal Assessment & Diagnostics","unit":"Renal","type":"mc","cj":"Recognize Cues","stem":"One hour after a percutaneous renal biopsy, which finding requires immediate action by the nurse?","opts":[{"t":"HR has increased from 78 to 112/min and BP has dropped from 128/80 to 98/60 mm Hg","c":true,"w":"Correct. Hemorrhage is the main risk after renal biopsy. Rising HR and falling BP suggest bleeding."},{"t":"The pressure dressing is dry and intact","c":false,"w":"Incorrect. This is an expected finding."},{"t":"The client rates discomfort at the biopsy site 2/10","c":false,"w":"Incorrect. Mild discomfort is expected."},{"t":"The client asks for a urinal","c":false,"w":"Incorrect. This is an opportunity to inspect the urine for blood, not an emergency."}],"take":"After renal biopsy: frequent vital signs, watch the urine for gross hematuria, report flank pain or dizziness, bed rest, and no heavy lifting for about 2 weeks."},{"topic":"Renal Assessment & Diagnostics","unit":"Renal","type":"sata","cj":"Analyze Cues","stem":"The nurse reviews a client's urinalysis. Which results are abnormal and should be reported? Select all that apply.","opts":[{"t":"pH 6.0","c":false,"w":"Incorrect. This is normal (range about 4.6 to 8.0)."},{"t":"WBC 2/hpf","c":false,"w":"Incorrect. Up to about 5 WBCs per high-power field is normal."},{"t":"RBC casts present","c":true,"w":"Correct. RBC casts point to glomerular disease such as glomerulonephritis."},{"t":"Specific gravity 1.015","c":false,"w":"Incorrect. The normal range is about 1.005 to 1.030."},{"t":"Glucose positive","c":true,"w":"Correct. Glucose is normally absent and suggests hyperglycemia."},{"t":"Protein 2+","c":true,"w":"Correct. Persistent proteinuria is often the earliest sign of kidney damage."},{"t":"Nitrite positive","c":true,"w":"Correct. Nitrites indicate gram-negative bacteria such as E. coli."}],"take":"Normal urine has no protein, glucose, ketones, nitrites, or casts. Casts show where the problem is: RBC casts mean glomerulus, WBC casts mean pyelonephritis."},{"topic":"Renal Assessment & Diagnostics","unit":"Renal","type":"sata","cj":"Take Action","stem":"The nurse is performing a renal and urinary physical assessment. Which techniques or interpretations are accurate? Select all that apply.","opts":[{"t":"Check for CVA tenderness by placing one palm over the costovertebral angle and striking it with the other fist","c":true,"w":"Correct. This is indirect fist percussion."},{"t":"Auscultate above the umbilicus, just lateral to the midline, for renal artery bruits","c":true,"w":"Correct. A bruit suggests renal artery stenosis."},{"t":"A distended bladder sounds dull on percussion above the symphysis pubis","c":true,"w":"Correct. A full bladder is dull, while an empty bladder cannot be percussed above the symphysis."},{"t":"Pain with CVA percussion is a normal finding","c":false,"w":"Incorrect. A thud may be felt, but pain suggests pyelonephritis or another kidney problem."},{"t":"Normal adult kidneys are easily palpable in most clients","c":false,"w":"Incorrect. The kidneys are deep and protected. Usually only the lower pole of the right kidney is felt, and only in thin clients."}],"take":"CVA tenderness means kidney. A bruit means renal artery stenosis. Dullness above the symphysis means a full bladder."},{"topic":"Renal Assessment & Diagnostics","unit":"Renal","type":"mc","cj":"Recognize Cues","stem":"Which finding after a cystoscopy should the nurse report to the provider?","opts":[{"t":"Urinary frequency","c":false,"w":"Incorrect. This is expected from bladder irritation."},{"t":"Burning on urination","c":false,"w":"Incorrect. This is expected. Warm sitz baths and fluids help."},{"t":"Pink-tinged urine","c":false,"w":"Incorrect. This is expected for a short time after the procedure."},{"t":"Bright red urine with clots and inability to void","c":true,"w":"Correct. This suggests hemorrhage and possible clot obstruction or retention."}],"take":"After cystoscopy, pink urine, burning, and frequency are expected. Bright red urine, clots, retention, or fever are not."},{"topic":"Effects of Aging","unit":"Renal","type":"sata","cj":"Recognize Cues","stem":"Which findings in an 80-year-old client are expected age-related changes of the urinary system? Select all that apply.","opts":[{"t":"Nocturia","c":true,"w":"Correct. The aging kidney concentrates urine less well, especially at night."},{"t":"Hematuria","c":false,"w":"Incorrect. Blood in the urine is never a normal aging change and needs evaluation."},{"t":"Decreased bladder capacity with more frequent voiding","c":true,"w":"Correct. Less bladder elasticity and muscle tone mean voiding more often, with less urine per void."},{"t":"Glucose in the urine","c":false,"w":"Incorrect. Glycosuria is abnormal at any age."},{"t":"Decreased creatinine clearance","c":true,"w":"Correct. Fewer nephrons and less renal blood flow lower the GFR."},{"t":"Sudden onset of confusion","c":false,"w":"Incorrect. Acute confusion is not normal aging. Look for a cause such as UTI."},{"t":"Less concentrated urine","c":true,"w":"Correct. The loop of Henle and tubules work less efficiently."}],"take":"Aging: fewer nephrons, lower GFR, nocturia, urgency, frequency, more residual urine. Hematuria and acute confusion are never normal."},{"topic":"Effects of Aging","unit":"Renal","type":"mc","cj":"Analyze Cues","stem":"An 82-year-old client is prescribed a medication that is excreted by the kidneys. Which age-related change is the main reason the nurse monitors closely for drug toxicity?","opts":[{"t":"Increased bladder capacity","c":false,"w":"Incorrect. Bladder capacity decreases with age and does not affect drug excretion."},{"t":"Fewer functioning nephrons and a lower glomerular filtration rate","c":true,"w":"Correct. Reduced GFR and creatinine clearance slow drug excretion, so drugs accumulate."},{"t":"Greater ability to concentrate urine","c":false,"w":"Incorrect. The ability to concentrate urine decreases with age."},{"t":"Increased renal blood flow","c":false,"w":"Incorrect. Renal blood flow decreases with age."}],"take":"Older adults clear renally excreted drugs more slowly. Expect lower doses and monitor drug levels and kidney function."},{"topic":"Effects of Aging","unit":"Renal","type":"sata","cj":"Generate Solutions","stem":"An older adult reports getting up three or four times a night to urinate and sometimes not making it in time. Which nursing interventions are appropriate? Select all that apply.","opts":[{"t":"Take a prescribed diuretic in the morning instead of the evening","c":true,"w":"Correct. Morning dosing moves the diuresis to daytime hours."},{"t":"Keep a night-light on and the path to the bathroom clear","c":true,"w":"Correct. This prevents falls during nighttime voiding."},{"t":"Restrict total fluids to 1,000 mL/day","c":false,"w":"Incorrect. Older adults are already at risk for dehydration, and concentrated urine irritates the bladder."},{"t":"Have a cup of coffee with the evening meal","c":false,"w":"Incorrect. Caffeine is a diuretic and bladder irritant."},{"t":"Place a bedside commode or urinal within reach at night","c":true,"w":"Correct. This shortens the distance and reduces fall risk."},{"t":"Limit fluids in the 2 hours before bed while keeping adequate daily intake","c":true,"w":"Correct. This reduces nocturia without risking dehydration."}],"take":"Nocturia in older adults: time fluids and diuretics, keep the path safe and lit, and keep a commode or urinal close."},{"topic":"Effects of Aging","unit":"Renal","type":"mc","cj":"Analyze Cues","stem":"A 76-year-old man reports hesitancy, straining to start his stream, a weak stream, and dribbling after voiding. What is the most likely cause?","opts":[{"t":"Functional incontinence","c":false,"w":"Incorrect. Functional incontinence comes from barriers outside the urinary tract."},{"t":"Interstitial cystitis","c":false,"w":"Incorrect. Interstitial cystitis causes bladder pain and frequency."},{"t":"Stress incontinence","c":false,"w":"Incorrect. Stress incontinence is leakage with coughing or lifting."},{"t":"Urinary retention from an enlarged prostate","c":true,"w":"Correct. BPH obstructs the urethra, causing hesitancy, straining, a weak stream, and retention."}],"take":"Older men: think BPH with retention and overflow. Older women: think stress incontinence from lower muscle tone."},{"topic":"Chronic Pyelonephritis","unit":"Renal","type":"mc","cj":"Analyze Cues","stem":"A client asks how chronic pyelonephritis differs from the kidney infection she had last year. Which explanation by the nurse is accurate?","opts":[{"t":"“Repeated kidney infections cause scarring, so the kidney becomes small and shrunken and loses function over time.”","c":true,"w":"Correct. Chronic pyelonephritis results from recurrent upper tract infections, often with obstruction or reflux, leading to fibrosis and atrophy."},{"t":"“It is an inherited condition in which fluid-filled cysts replace kidney tissue.”","c":false,"w":"Incorrect. That describes polycystic kidney disease."},{"t":"“It is a sudden infection with high fever and flank pain that clears completely with antibiotics.”","c":false,"w":"Incorrect. That describes acute pyelonephritis."},{"t":"“It happens when antibodies to strep bacteria get trapped in the kidney's filters.”","c":false,"w":"Incorrect. That describes post-streptococcal glomerulonephritis."}],"take":"Chronic pyelonephritis: a small, scarred, shrunken kidney from repeated infection. It can progress to CKD."},{"topic":"Chronic Pyelonephritis","unit":"Renal","type":"sata","cj":"Analyze Cues","stem":"Which conditions increase a client's risk for chronic pyelonephritis? Select all that apply.","opts":[{"t":"Recurrent upper urinary tract infections","c":true,"w":"Correct. Each infection adds scarring."},{"t":"One promptly treated episode of uncomplicated cystitis","c":false,"w":"Incorrect. A single treated lower UTI does not scar the kidney."},{"t":"A neurogenic bladder with urinary stasis","c":true,"w":"Correct. Incomplete emptying leads to recurrent infection."},{"t":"Stress incontinence","c":false,"w":"Incorrect. Leakage with abdominal pressure does not cause upper tract infection."},{"t":"Vesicoureteral reflux","c":true,"w":"Correct. Reflux repeatedly carries bacteria up to the kidney."},{"t":"Urinary tract obstruction from kidney stones or BPH","c":true,"w":"Correct. Obstruction causes stasis and repeated infection."}],"take":"Chronic pyelonephritis usually comes from obstruction, reflux, or stasis that keeps causing upper tract infections."},{"topic":"Chronic Pyelonephritis","unit":"Renal","type":"sata","cj":"Recognize Cues","stem":"A client with a long history of chronic pyelonephritis is seen for follow-up. Which findings suggest progression toward chronic kidney disease? Select all that apply.","opts":[{"t":"Rising serum creatinine and falling GFR","c":true,"w":"Correct. These show declining filtration."},{"t":"Nocturia from a reduced ability to concentrate urine","c":true,"w":"Correct. Tubular damage impairs urine concentration."},{"t":"New hypertension","c":true,"w":"Correct. Hypertension is a common result of renal scarring and also speeds kidney damage."},{"t":"Small, scarred kidneys on imaging","c":true,"w":"Correct. This is the classic imaging finding."},{"t":"Proteinuria","c":true,"w":"Correct. Persistent proteinuria reflects ongoing kidney damage."},{"t":"Increased creatinine clearance","c":false,"w":"Incorrect. Creatinine clearance falls as kidney function declines."},{"t":"Hemoglobin 14.2 g/dL","c":false,"w":"Incorrect. This is normal. Anemia would be expected as CKD advances."}],"take":"Watch for HTN, proteinuria, nocturia, and a rising creatinine in chronic pyelonephritis. These signal developing CKD."},{"topic":"Chronic Pyelonephritis","unit":"Renal","type":"mc","cj":"Evaluate Outcomes","stem":"The nurse has taught a client with chronic pyelonephritis how to protect remaining kidney function. Which statement indicates the teaching was effective?","opts":[{"t":"“I won't need urine cultures as long as I feel fine.”","c":false,"w":"Incorrect. Recurrent infection is often silent in chronic pyelonephritis."},{"t":"“I'll drink less fluid so I don't have to urinate as often.”","c":false,"w":"Incorrect. Adequate fluids prevent stasis unless the provider restricts them."},{"t":"“I'll take ibuprofen every day for my back pain.”","c":false,"w":"Incorrect. NSAIDs are nephrotoxic."},{"t":"“I'll keep my follow-up urine culture appointments and check my blood pressure regularly.”","c":true,"w":"Correct. Cultures catch recurrent infection early, and BP control slows kidney damage."}],"take":"Protect the kidney: treat infections early, control BP, maintain fluids, and avoid nephrotoxins."},{"topic":"Chronic Glomerulonephritis","unit":"Renal","type":"sata","cj":"Analyze Cues","stem":"The nurse reviews the histories of several clients. Which clients have a risk factor for chronic glomerulonephritis? Select all that apply.","opts":[{"t":"A 28-year-old with a history of illegal IV drug use","c":true,"w":"Correct. Illegal drug use, such as heroin, is a risk factor."},{"t":"A 30-year-old with interstitial cystitis","c":false,"w":"Incorrect. IC is a bladder condition and does not damage the glomeruli."},{"t":"A 25-year-old with stress incontinence after childbirth","c":false,"w":"Incorrect. This is a pelvic floor problem, not a glomerular one."},{"t":"A 45-year-old with scleroderma","c":true,"w":"Correct. Scleroderma is a known cause."},{"t":"A 34-year-old woman with systemic lupus erythematosus","c":true,"w":"Correct. SLE causes immune-mediated glomerular damage."},{"t":"A 60-year-old with 20 years of poorly controlled hypertension","c":true,"w":"Correct. Long-standing HTN damages the glomeruli."},{"t":"A 52-year-old with type 1 diabetes since childhood","c":true,"w":"Correct. Diabetic nephropathy is a leading cause."}],"take":"Chronic GN causes: diabetic nephropathy, HTN, SLE, scleroderma, viral infections, illegal drug use, and post-strep GN."},{"topic":"Chronic Glomerulonephritis","unit":"Renal","type":"mc","cj":"Recognize Cues","stem":"Chronic glomerulonephritis is most often first discovered when:","opts":[{"t":"The client reports frequent burning on urination","c":false,"w":"Incorrect. That suggests a lower UTI."},{"t":"A routine urinalysis shows proteinuria or hematuria, or an elevated BP is found","c":true,"w":"Correct. It develops over 20 to 30 years or longer with few symptoms, so it is often found incidentally."},{"t":"A child develops cola-colored urine 2 weeks after a sore throat","c":false,"w":"Incorrect. That is acute post-streptococcal glomerulonephritis."},{"t":"The client has sudden, severe flank pain with fever","c":false,"w":"Incorrect. That suggests acute pyelonephritis or a stone."}],"take":"Chronic GN is slow and silent. The goal is slowing progression and preventing complications. Dialysis or transplant comes at ESRD."},{"topic":"Chronic Glomerulonephritis","unit":"Renal","type":"sata","cj":"Generate Solutions","stem":"Which interventions help slow the progression of chronic glomerulonephritis? Select all that apply.","opts":[{"t":"Take potassium supplements with the ACE inhibitor","c":false,"w":"Incorrect. ACE inhibitors raise potassium, and reduced kidney function adds to the risk of hyperkalemia."},{"t":"Follow a high-protein diet with protein supplements","c":false,"w":"Incorrect. High protein intake overworks damaged glomeruli."},{"t":"Tightly manage blood glucose in clients with diabetes","c":true,"w":"Correct. Good glycemic control slows diabetic nephropathy."},{"t":"Treat the underlying disease, such as SLE","c":true,"w":"Correct. Controlling the cause slows glomerular damage."},{"t":"Avoid nephrotoxic drugs such as NSAIDs","c":true,"w":"Correct. Additional injury speeds the decline."},{"t":"Limit dietary sodium","c":true,"w":"Correct. Sodium restriction helps control BP and edema."},{"t":"Control blood pressure, often with an ACE inhibitor or ARB","c":true,"w":"Correct. These lower BP and reduce proteinuria, which protects the glomeruli."}],"take":"Slow any glomerular disease with BP control (ACE inhibitor or ARB), sodium limits, glucose control, and avoiding nephrotoxins."},{"topic":"Chronic Glomerulonephritis","unit":"Renal","type":"mc","cj":"Evaluate Outcomes","stem":"A client with chronic glomerulonephritis was started on lisinopril 2 weeks ago. Which finding requires follow-up?","opts":[{"t":"Serum sodium 138 mEq/L","c":false,"w":"Incorrect. This is normal."},{"t":"BP 128/78 mm Hg","c":false,"w":"Incorrect. This shows good BP control."},{"t":"Urine protein decreased from 3+ to 1+","c":false,"w":"Incorrect. This is a desired effect. ACE inhibitors reduce proteinuria."},{"t":"Serum potassium 5.9 mEq/L","c":true,"w":"Correct. ACE inhibitors reduce aldosterone, so potassium rises, and reduced kidney function adds to it. This level is dangerous for dysrhythmias."}],"take":"ACE inhibitor in kidney disease: expect lower BP and less proteinuria. Watch potassium and creatinine."},{"topic":"Polycystic Kidney Disease","unit":"Renal","type":"sata","cj":"Recognize Cues","stem":"A 42-year-old client has autosomal dominant polycystic kidney disease (PKD). Which findings would the nurse expect? Select all that apply.","opts":[{"t":"Hematuria","c":true,"w":"Correct. Cysts can rupture and bleed."},{"t":"Small, shrunken kidneys on ultrasound","c":false,"w":"Incorrect. That is chronic pyelonephritis or end-stage CKD. PKD kidneys are enlarged."},{"t":"Hypertension","c":true,"w":"Correct. Hypertension is common and often the first sign."},{"t":"Pain or a feeling of heaviness in the back, side, or abdomen","c":true,"w":"Correct. Enlarging cysts stretch the kidney capsule."},{"t":"Proteinuria","c":true,"w":"Correct. Expanding cysts damage surrounding nephrons, so protein can leak into the urine."},{"t":"Enlarged, palpable kidneys and an increased abdominal girth","c":true,"w":"Correct. Multiple cysts make the kidneys grow."},{"t":"Hypotension","c":false,"w":"Incorrect. PKD causes hypertension."}],"take":"PKD: big kidneys full of cysts, HTN, hematuria, flank pain or heaviness, and gradual loss of function."},{"topic":"Polycystic Kidney Disease","unit":"Renal","type":"mc","cj":"Prioritize Hypotheses","stem":"A client with polycystic kidney disease suddenly reports “the worst headache of my life” and a stiff neck. Which action should the nurse take first?","opts":[{"t":"Check the urine for blood","c":false,"w":"Incorrect. Hematuria is a PKD finding, but it is not the priority here."},{"t":"Assess neurologic status and notify the provider immediately","c":true,"w":"Correct. PKD is associated with cerebral (berry) aneurysms. A sudden, severe headache suggests a ruptured aneurysm and subarachnoid hemorrhage, which is an emergency."},{"t":"Give acetaminophen and dim the lights","c":false,"w":"Incorrect. This treats the symptom and delays care for a possible bleed."},{"t":"Encourage oral fluids","c":false,"w":"Incorrect. This does not address a possible intracranial hemorrhage."}],"take":"PKD is a systemic disease: cerebral aneurysms, liver cysts, and heart valve problems. A sudden severe headache is an emergency."},{"topic":"Polycystic Kidney Disease","unit":"Renal","type":"sata","cj":"Generate Solutions","stem":"A client with PKD is prescribed tolvaptan. Which instructions should the nurse include? Select all that apply.","opts":[{"t":"This medicine dissolves the cysts and cures PKD","c":false,"w":"Incorrect. Tolvaptan slows cyst growth. It does not cure PKD."},{"t":"Take each dose with grapefruit juice to improve absorption","c":false,"w":"Incorrect. Grapefruit juice raises tolvaptan levels and should be avoided."},{"t":"Keep appointments for regular liver function tests","c":true,"w":"Correct. Liver enzymes are monitored routinely during treatment."},{"t":"Expect to urinate more and feel thirsty, so keep water nearby and drink when thirsty","c":true,"w":"Correct. Tolvaptan blocks ADH (vasopressin), causing large volumes of dilute urine. Dehydration must be prevented."},{"t":"Restrict fluids to 1 L/day while taking it","c":false,"w":"Incorrect. Fluid restriction plus tolvaptan's water loss can cause severe dehydration."},{"t":"Report yellow skin, dark urine, right upper abdominal pain, or unusual tiredness","c":true,"w":"Correct. Tolvaptan has a boxed warning for liver injury."}],"take":"Tolvaptan slows cyst growth. Expect polyuria and thirst, do not restrict water, and monitor the liver."},{"topic":"Polycystic Kidney Disease","unit":"Renal","type":"sata","cj":"Generate Solutions","stem":"Which teaching points should the nurse include for a client newly diagnosed with polycystic kidney disease? Select all that apply.","opts":[{"t":"Each of your children has a 50% chance of inheriting PKD, and genetic counseling is available","c":true,"w":"Correct. Adult PKD is autosomal dominant."},{"t":"Report fever, painful urination, or blood in the urine","c":true,"w":"Correct. Cyst infection, UTI, and bleeding are common complications."},{"t":"Nephrectomy is the first-line treatment to stop new cysts","c":false,"w":"Incorrect. Nephrectomy is reserved for chronic, serious pain, bleeding, or infection."},{"t":"Take ibuprofen regularly for flank pain","c":false,"w":"Incorrect. NSAIDs are nephrotoxic. Use acetaminophen or other options the provider recommends."},{"t":"Check your blood pressure regularly at home","c":true,"w":"Correct. BP control slows the decline in kidney function."},{"t":"Avoid contact sports that could injure the enlarged kidneys","c":true,"w":"Correct. Trauma can rupture cysts and cause bleeding."}],"take":"PKD teaching: inheritance, BP control, protect the kidneys from trauma and nephrotoxins, and report signs of infection or bleeding."},{"topic":"Chronic Kidney Disease","unit":"Renal","type":"mc","cj":"Analyze Cues","stem":"A client's eGFR has measured 38 mL/min/1.73 m² for the past 5 months. Which CKD stage does this represent?","opts":[{"t":"Stage 3b","c":true,"w":"Correct. Stage 3b is a GFR of 30 to 44. A GFR below 60 for more than 3 months meets the definition of CKD."},{"t":"Stage 2","c":false,"w":"Incorrect. Stage 2 is a GFR of 60 to 89."},{"t":"Stage 3a","c":false,"w":"Incorrect. Stage 3a is a GFR of 45 to 59."},{"t":"Stage 4","c":false,"w":"Incorrect. Stage 4 is a GFR of 15 to 29."}],"take":"CKD stages by GFR: 1 is 90 or above, 2 is 60 to 89, 3a is 45 to 59, 3b is 30 to 44, 4 is 15 to 29, 5 (ESRD) is below 15."},{"topic":"Chronic Kidney Disease","unit":"Renal","type":"sata","cj":"Recognize Cues","stem":"A client with stage 4 CKD comes to the clinic for a routine visit. Which findings require follow-up? Select all that apply.","opts":[{"t":"Tall, peaked T waves on the ECG","c":true,"w":"Correct. This is the classic ECG sign of hyperkalemia."},{"t":"Serum potassium 6.1 mEq/L","c":true,"w":"Correct. Hyperkalemia is common in CKD and can cause fatal dysrhythmias."},{"t":"Uses a salt substitute to season food","c":true,"w":"Correct. Most salt substitutes are potassium chloride and worsen hyperkalemia."},{"t":"Takes over-the-counter naproxen every day for knee pain","c":true,"w":"Correct. NSAIDs are nephrotoxic and should be avoided in CKD."},{"t":"Hemoglobin A1C 6.6%","c":false,"w":"Incorrect. This reflects good glycemic control."},{"t":"Takes lisinopril, and BP is 126/76 mm Hg","c":false,"w":"Incorrect. An ACE inhibitor with controlled BP is appropriate and protects the kidneys."}],"take":"In CKD, potassium climbs as output falls. Watch for peaked T waves, salt substitutes, and NSAIDs. Sodium polystyrene sulfonate (Kayexalate) may be given."},{"topic":"Chronic Kidney Disease","unit":"Renal","type":"sata","cj":"Take Action","stem":"A client with CKD has a hemoglobin of 8.9 g/dL and is prescribed epoetin alfa. Which actions should the nurse take? Select all that apply.","opts":[{"t":"Check BP before each dose and report uncontrolled hypertension","c":true,"w":"Correct. Epoetin can raise BP. Uncontrolled hypertension is a reason to hold the dose."},{"t":"Monitor hemoglobin and report a level above 11 g/dL","c":true,"w":"Correct. Higher hemoglobin levels increase the risk of stroke, MI, and thrombosis."},{"t":"Shake the vial well before drawing up the dose","c":false,"w":"Incorrect. Shaking can denature the protein. Roll the vial gently or do not agitate it."},{"t":"Give the injection subcutaneously as prescribed","c":true,"w":"Correct. Epoetin is given subcutaneously (or IV in clients on dialysis)."},{"t":"Expect iron supplements to be prescribed as well","c":true,"w":"Correct. The marrow needs adequate iron to respond to epoetin."},{"t":"Tell the client energy will improve within 24 hours","c":false,"w":"Incorrect. It takes weeks for the hemoglobin to rise."},{"t":"Teach the client to report chest pain, leg swelling, or a sudden severe headache","c":true,"w":"Correct. These may be signs of thrombosis, MI, or stroke."}],"take":"CKD anemia comes from low erythropoietin. Epoetin: check BP, keep Hgb from overshooting 11, give iron, and watch for clots."},{"topic":"Chronic Kidney Disease","unit":"Renal","type":"sata","cj":"Generate Solutions","stem":"A client with CKD has these results: phosphorus 6.4 mg/dL, calcium 7.6 mg/dL, and an elevated parathyroid hormone (PTH). Which instructions should the nurse include? Select all that apply.","opts":[{"t":"Take vitamin D (calcitriol) as prescribed","c":true,"w":"Correct. Active vitamin D raises calcium absorption and helps suppress PTH."},{"t":"Take the phosphate binder at bedtime on an empty stomach","c":false,"w":"Incorrect. A binder taken without food has no phosphorus to bind."},{"t":"Use a sodium phosphate (Fleet) enema for constipation","c":false,"w":"Incorrect. Phosphate enemas add phosphorus and are avoided in CKD."},{"t":"Avoid magnesium antacids and laxatives such as milk of magnesia","c":true,"w":"Correct. Magnesium builds up when the kidneys cannot excrete it."},{"t":"Take your phosphate binder with meals","c":true,"w":"Correct. Binders must be in the gut with food to bind dietary phosphorus."},{"t":"Limit high-phosphorus foods such as dairy products, colas, processed meats, and nuts","c":true,"w":"Correct. This lowers the phosphorus load."}],"take":"CKD mineral and bone disorder: high phosphorus, low calcium, high PTH, and bone loss. Treat with binders at meals, vitamin D, and a low-phosphorus diet."},{"topic":"Chronic Kidney Disease","unit":"Renal","type":"mc","cj":"Analyze Cues","stem":"A client with stage 5 CKD has deep, rapid respirations at 30/min. ABG results: pH 7.29, PaCO2 30 mm Hg, HCO3 16 mEq/L. How should the nurse interpret these findings?","opts":[{"t":"Metabolic acidosis with respiratory compensation","c":true,"w":"Correct. Low pH and low bicarbonate indicate metabolic acidosis, because the kidneys cannot excrete acid or reabsorb bicarbonate. The low PaCO2 and Kussmaul breathing are the lungs compensating."},{"t":"Metabolic alkalosis","c":false,"w":"Incorrect. Bicarbonate is low, not high."},{"t":"Respiratory alkalosis","c":false,"w":"Incorrect. The pH is acidic, not alkaline."},{"t":"Respiratory acidosis","c":false,"w":"Incorrect. PaCO2 is low. In respiratory acidosis it would be high."}],"take":"CKD causes metabolic acidosis: the kidneys cannot excrete acid or keep bicarbonate. Kussmaul respirations are compensation."},{"topic":"Chronic Kidney Disease","unit":"Renal","type":"sata","cj":"Recognize Cues","stem":"A client with stage 5 CKD who is not yet on dialysis is being assessed. Which findings indicate fluid volume excess? Select all that apply.","opts":[{"t":"Weight gain of 2 kg over 2 days","c":true,"w":"Correct. Rapid weight gain reflects fluid. 1 kg is about 1 L."},{"t":"A pericardial friction rub","c":false,"w":"Incorrect. A friction rub indicates uremic pericarditis, not fluid volume. It needs follow-up for a different reason."},{"t":"Crackles in both lung bases","c":true,"w":"Correct. Fluid is accumulating in the lungs."},{"t":"Poor skin turgor and dry mucous membranes","c":false,"w":"Incorrect. These indicate a fluid deficit."},{"t":"An S3 heart sound","c":true,"w":"Correct. An S3 gallop is a sign of volume overload."},{"t":"Jugular venous distention with the head of the bed at 45 degrees","c":true,"w":"Correct. JVD reflects increased venous volume."}],"take":"Fluid overload in CKD: weight gain, edema, crackles, JVD, S3, and HTN. Daily weights are the best tool."},{"topic":"Chronic Kidney Disease","unit":"Renal","type":"sata","cj":"Evaluate Outcomes","stem":"The nurse reviews dietary choices with a client on hemodialysis who must limit potassium and phosphorus. Which choices indicate understanding? Select all that apply.","opts":[{"t":"A banana with breakfast","c":false,"w":"Incorrect. Bananas are high in potassium."},{"t":"An apple instead of a banana","c":true,"w":"Correct. Apples are low in potassium. Bananas are high."},{"t":"A salt substitute to replace table salt","c":false,"w":"Incorrect. Salt substitutes are usually potassium chloride."},{"t":"White rice instead of brown rice","c":true,"w":"Correct. White rice is lower in potassium and phosphorus than brown rice."},{"t":"Green beans as the vegetable side","c":true,"w":"Correct. Green beans are a lower-potassium vegetable."},{"t":"A baked potato with the skin","c":false,"w":"Incorrect. Potatoes, especially with the skin, are very high in potassium."}],"take":"Hemodialysis diet: limit sodium, potassium, phosphorus, and fluid. Protein is not restricted on dialysis. Peritoneal dialysis is less restrictive."},{"topic":"Chronic Kidney Disease","unit":"Renal","type":"mc","cj":"Take Action","stem":"A client receiving hemodialysis had a urine output of 200 mL yesterday. Using the common guideline for daily fluid intake, how much fluid should the client be allowed today?","opts":[{"t":"600 mL","c":false,"w":"Incorrect. This covers insensible loss only."},{"t":"1,000 mL","c":false,"w":"Incorrect. This is more than the guideline allows."},{"t":"1,500 mL","c":false,"w":"Incorrect. This would likely cause excessive weight gain between treatments."},{"t":"800 mL","c":true,"w":"Correct. The guideline is 600 mL for insensible loss plus the previous day's urine output: 600 + 200 = 800 mL."}],"take":"Hemodialysis fluid allowance: 600 mL plus the previous day's urine output. The goal is a weight gain of no more than 1 to 2 kg between sessions."},{"topic":"Chronic Kidney Disease","unit":"Renal","type":"sata","cj":"Recognize Cues","stem":"Which findings would the nurse expect in a client with uremia from advanced CKD? Select all that apply.","opts":[{"t":"Stomatitis","c":true,"w":"Correct. Ammonia irritates the oral mucosa."},{"t":"An elevated hemoglobin","c":false,"w":"Incorrect. CKD causes anemia from low erythropoietin."},{"t":"Ammonia-like odor on the breath","c":true,"w":"Correct. Urease in the mouth breaks urea down to ammonia, causing uremic fetor and halitosis."},{"t":"Itching with fine white crystals on the skin","c":true,"w":"Correct. This is uremic frost. Use unscented lotions for itching."},{"t":"Anorexia, nausea, and vomiting","c":true,"w":"Correct. Uremia affects the entire GI system."},{"t":"Hyperactive reflexes from a high serum calcium","c":false,"w":"Incorrect. CKD causes hypocalcemia, not hypercalcemia."},{"t":"Increasing urine output","c":false,"w":"Incorrect. Urine output decreases as BUN rises."}],"take":"Uremia: nausea, anorexia, uremic fetor, stomatitis, pruritus or uremic frost, fatigue, and changes in mental status."},{"topic":"Chronic Kidney Disease","unit":"Renal","type":"sata","cj":"Generate Solutions","stem":"Which interventions should the nurse include in the plan of care for a client with stage 4 CKD? Select all that apply.","opts":[{"t":"Weigh daily at the same time, on the same scale, in similar clothing","c":true,"w":"Correct. Daily weight is the most accurate indicator of fluid status."},{"t":"Keep strict intake and output records","c":true,"w":"Correct. I&O guides fluid management."},{"t":"Suggest unscented lotion and short nails for itchy skin","c":true,"w":"Correct. These protect the skin from uremic pruritus."},{"t":"Discuss the client's values and preferences, and teach about dialysis and transplant options","c":true,"w":"Correct. Stage 4 is the time to prepare for kidney replacement therapy."},{"t":"Encourage high-protein supplements to prevent muscle loss","c":false,"w":"Incorrect. High-protein diets and supplements can overstress diseased kidneys. Normal protein intake is encouraged before dialysis."},{"t":"Recommend OTC NSAIDs for joint pain","c":false,"w":"Incorrect. NSAIDs are nephrotoxic."},{"t":"Screen for depression and anxiety","c":true,"w":"Correct. Depression, anxiety, and body image changes are common in CKD."}],"take":"CKD nursing priorities: fluid status (weight, I&O), electrolytes, anemia, skin, psychosocial needs, and planning for dialysis or transplant."},{"topic":"Chronic Kidney Disease","unit":"Renal","type":"sata","cj":"Take Action","stem":"A client with stage 4 CKD (eGFR 22 mL/min) is admitted. Which prescriptions should the nurse clarify with the provider? Select all that apply.","opts":[{"t":"Metformin 1,000 mg orally twice daily","c":true,"w":"Correct. Metformin is contraindicated with an eGFR below 30 because of the risk of lactic acidosis."},{"t":"Ibuprofen 600 mg orally every 6 hours as needed","c":true,"w":"Correct. NSAIDs are nephrotoxic."},{"t":"Sodium phosphate (Fleet) enema as needed","c":true,"w":"Correct. Phosphate enemas raise phosphorus."},{"t":"Magnesium hydroxide (milk of magnesia) as needed for constipation","c":true,"w":"Correct. Magnesium accumulates in CKD."},{"t":"Gentamicin IV every 8 hours with no drug levels ordered","c":true,"w":"Correct. Aminoglycosides are nephrotoxic and need dose adjustment and level monitoring in CKD."},{"t":"Epoetin alfa subcutaneously weekly","c":false,"w":"Incorrect. This is appropriate treatment for CKD anemia."},{"t":"Calcium acetate with each meal","c":false,"w":"Incorrect. This is an appropriate phosphate binder."}],"take":"In CKD, question nephrotoxins (NSAIDs, aminoglycosides, contrast), metformin, magnesium products, and phosphate enemas, and expect renal dose adjustments."},{"topic":"Post-Strep Glomerulonephritis","unit":"Pediatric Renal","type":"sata","cj":"Recognize Cues","stem":"A 7-year-old is brought to the clinic with cola-colored urine 2 weeks after a sore throat. Which findings are consistent with post-streptococcal glomerulonephritis (PSGN)? Select all that apply.","opts":[{"t":"Elevated antistreptolysin O (ASO) titer","c":true,"w":"Correct. This shows a recent strep infection."},{"t":"Massive proteinuria with severe hypoalbuminemia and high cholesterol","c":false,"w":"Incorrect. That pattern is nephrotic syndrome. PSGN causes hematuria with mild to moderate proteinuria."},{"t":"Elevated BUN and serum creatinine","c":true,"w":"Correct. Glomerular inflammation reduces filtration."},{"t":"Periorbital edema that is worse in the morning","c":true,"w":"Correct. Edema in PSGN is classically periorbital and worse after lying flat overnight."},{"t":"Cloudy, foul-smelling urine with positive nitrites","c":false,"w":"Incorrect. This suggests a UTI. PSGN is immune mediated, not an active infection of the urinary tract."},{"t":"BP 138/90 mm Hg","c":true,"w":"Correct. Hypertension results from sodium and water retention."}],"take":"PSGN: cola or tea-colored urine, periorbital edema worse in the morning, HTN, and oliguria 1 to 3 weeks after strep. Expect high ASO and low C3 complement."},{"topic":"Post-Strep Glomerulonephritis","unit":"Pediatric Renal","type":"mc","cj":"Prioritize Hypotheses","stem":"A child hospitalized with PSGN reports a headache and blurred vision. BP is 160/104 mm Hg. Which other finding would be the greatest concern?","opts":[{"t":"Vomiting and increasing drowsiness","c":true,"w":"Correct. Headache, visual changes, vomiting, and decreasing alertness with severe HTN suggest hypertensive encephalopathy, which can progress to seizures. Notify the provider immediately and have seizure precautions ready."},{"t":"Periorbital edema in the morning","c":false,"w":"Incorrect. This is an expected finding."},{"t":"Tea-colored urine","c":false,"w":"Incorrect. This is an expected finding of PSGN."},{"t":"Decreased appetite","c":false,"w":"Incorrect. This is common and not urgent."}],"take":"The biggest acute danger in PSGN is hypertension: watch for encephalopathy (headache, visual changes, vomiting, seizures) and fluid overload."},{"topic":"Post-Strep Glomerulonephritis","unit":"Pediatric Renal","type":"sata","cj":"Generate Solutions","stem":"Which interventions should the nurse include in the plan of care for a child with acute PSGN? Select all that apply.","opts":[{"t":"Encourage a high-sodium, high-potassium diet to replace losses","c":false,"w":"Incorrect. Sodium is limited for edema and HTN, and potassium is limited during oliguria."},{"t":"Keep strict intake and output records","c":true,"w":"Correct. Output trends show whether kidney function is recovering."},{"t":"Monitor BP frequently","c":true,"w":"Correct. Hypertension is the main acute danger."},{"t":"Give antihypertensives and diuretics as prescribed","c":true,"w":"Correct. Management is supportive with antihypertensives and diuretics."},{"t":"Place the child on droplet isolation because PSGN is contagious","c":false,"w":"Incorrect. PSGN is an immune reaction that occurs after the infection. It is not contagious."},{"t":"Weigh daily at the same time on the same scale","c":true,"w":"Correct. This is the most accurate way to track fluid retention."},{"t":"Provide quiet activities and rest periods during the acute phase","c":true,"w":"Correct. Rest is encouraged while the child is edematous and hypertensive."}],"take":"PSGN care is supportive: weights, I&O, BP, antihypertensives, diuretics, limited sodium (and potassium if oliguric), and rest."},{"topic":"Post-Strep Glomerulonephritis","unit":"Pediatric Renal","type":"mc","cj":"Analyze Cues","stem":"A parent asks, “How did a sore throat hurt my child's kidneys?” Which response by the nurse is accurate?","opts":[{"t":"“The strep bacteria spread from the throat and are infecting the kidneys right now.”","c":false,"w":"Incorrect. PSGN is an immune response that happens after the infection, not an active kidney infection."},{"t":"“It is an inherited kidney problem that the sore throat uncovered.”","c":false,"w":"Incorrect. PSGN is acquired, not inherited."},{"t":"“The body made antibodies against the strep bacteria. Those antibodies joined with bacterial pieces and got trapped in the kidney's filters, causing inflammation.”","c":true,"w":"Correct. Antigen-antibody complexes deposit in the glomerulus and trigger inflammation of the glomerular basement membrane."},{"t":"“The antibiotics used for the sore throat damaged the kidneys.”","c":false,"w":"Incorrect. This is inaccurate and may discourage future treatment."}],"take":"PSGN is immune complex mediated. It appears 1 to 3 weeks after strep pharyngitis (or several weeks after a skin infection) and usually resolves."},{"topic":"Post-Strep Glomerulonephritis","unit":"Pediatric Renal","type":"sata","cj":"Evaluate Outcomes","stem":"Which findings indicate that a child's PSGN is improving? Select all that apply.","opts":[{"t":"Increasing periorbital edema","c":false,"w":"Incorrect. This shows ongoing fluid retention."},{"t":"Increased urine output","c":true,"w":"Correct. Diuresis is often the first sign of recovery."},{"t":"Urine changing from cola-colored to light yellow","c":true,"w":"Correct. Gross hematuria is resolving."},{"t":"Rising serum creatinine","c":false,"w":"Incorrect. This shows worsening filtration."},{"t":"Decreasing daily weight","c":true,"w":"Correct. Weight loss shows retained fluid is leaving."},{"t":"Persistent headache with vomiting","c":false,"w":"Incorrect. These suggest worsening hypertension and possible encephalopathy."}],"take":"Recovery from PSGN: diuresis, weight loss, falling BP, and clearing urine. Microscopic hematuria can persist for months."}]</script>
<script>
(function(){
"use strict";
var Q = JSON.parse(document.getElementById('qdata').textContent);
Q.forEach(function(q,i){ q.i=i; q.correct=[]; q.opts.forEach(function(o,j){ if(o.c) q.correct.push(j); }); });
var UNITS=[]; var TOPICS=[]; var TOPIC_UNIT={};
Q.forEach(function(q){ if(UNITS.indexOf(q.unit)<0) UNITS.push(q.unit); if(TOPICS.indexOf(q.topic)<0){ TOPICS.push(q.topic); TOPIC_UNIT[q.topic]=q.unit; } });
var CJ=['Recognize Cues','Analyze Cues','Prioritize Hypotheses','Generate Solutions','Take Action','Evaluate Outcomes'];
var KEY='gu-renal-nclex-v1';
var LET='ABCDEFGHIJ';
var $=function(id){return document.getElementById(id);};

var DEFAULTS={mode:'practice',count:'all',type:'both',topics:TOPICS.slice(),shuffleQ:true,shuffleO:true,timer:'off'};
var S={settings:clone(DEFAULTS),session:null,view:'start',review:null,navTab:'all',confirm:false};

function clone(o){return JSON.parse(JSON.stringify(o));}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmtTime(sec){sec=Math.max(0,Math.round(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+String(m).padStart(2,'0'):String(m))+':'+String(s).padStart(2,'0');}

function save(){ try{ var d={settings:S.settings,session:S.session,view:S.view==='summary'?'quiz':S.view,review:S.review}; localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} }
function load(data){
  var d=data;
  if(!d){ try{ var raw=localStorage.getItem(KEY); if(raw) d=JSON.parse(raw); }catch(e){ d=null; } }
  if(!d||!d.settings) return;
  var st=Object.assign(clone(DEFAULTS),d.settings);
  st.topics=(st.topics||[]).filter(function(t){return TOPICS.indexOf(t)>=0;});
  S.settings=st;
  if(d.session && d.session.order && d.session.order.every(function(i){return Q[i];})){
    S.session=d.session; S.review=d.review||null;
    S.view=d.view||'start';
    if(S.view==='review' && !S.review) S.view='results';
    if(S.view==='quiz' && S.session.finished) S.view='results';
    if((S.view==='results'||S.view==='review') && !S.session.finished) S.view='quiz';
  }
}

/* ---------- scoring ---------- */
function sel(i){ return (S.session && S.session.ans[i]) || []; }
function isCorrect(i,a){ var q=Q[i]; a=a||sel(i); return a.length===q.correct.length && a.every(function(j){return q.opts[j].c;}); }
function partial(i,a){ var q=Q[i]; a=a||sel(i); if(q.type==='mc') return (a.length===1&&q.opts[a[0]].c)?1:0; var p=0,m=0; a.forEach(function(j){ if(q.opts[j].c) p++; else m++; }); return Math.max(0,p-m)/q.correct.length; }
function revealed(i){ var s=S.session; return s.finished || (s.mode==='practice' && !!s.checked[i]); }
function status(i){
  var s=S.session, a=sel(i), has=a.length>0;
  if(revealed(i)) return has ? (isCorrect(i,a)?'correct':'incorrect') : 'unanswered';
  if(has) return 'answered';
  if(s.visited[i]) return 'skipped';
  return 'unseen';
}

/* ---------- session ---------- */
function pool(){ var st=S.settings; return Q.filter(function(q){ return st.topics.indexOf(q.topic)>=0 && (st.type==='both'||q.type===st.type); }).map(function(q){return q.i;}); }
function newSession(ids, mode){
  var st=S.settings;
  var order=ids.slice();
  if(st.shuffleQ) shuffle(order); else order.sort(function(a,b){return a-b;});
  var optOrder={};
  order.forEach(function(i){ var p=Q[i].opts.map(function(_,j){return j;}); if(st.shuffleO) shuffle(p); optOrder[i]=p; });
  S.session={mode:mode||st.mode,order:order,optOrder:optOrder,cur:0,ans:{},checked:{},flags:{},visited:{},elapsed:0,
    timer:st.timer,limit:st.timer==='down'?order.length*90:0,finished:false,timedOut:false,startedAt:Date.now()};
  S.session.visited[order[0]]=true;
  S.review=null; S.view='quiz'; S.confirm=false;
  save(); render(); window.scrollTo(0,0);
}
function startFromSettings(){
  var p=pool(); if(!p.length) return;
  var st=S.settings, n=st.count==='all'?p.length:Math.min(+st.count,p.length);
  if(n<p.length){ shuffle(p); p=p.slice(0,n); }
  newSession(p);
}
function curQ(){ var s=S.session; return s.order[s.cur]; }
function go(pos){
  var s=S.session; if(pos<0||pos>=s.order.length) return;
  s.cur=pos; s.visited[s.order[pos]]=true; S.confirm=false;
  if(S.view!=='quiz'){ S.view='quiz'; }
  save(); render(); window.scrollTo(0,0);
}
function next(){ var s=S.session; if(s.cur<s.order.length-1) go(s.cur+1); else openSummary(); }
function back(){ var s=S.session; if(s.cur>0) go(s.cur-1); }
function skip(){
  var s=S.session, n=s.order.length;
  for(var k=1;k<n;k++){ var pos=(s.cur+k)%n, i=s.order[pos]; var open=s.mode==='practice' ? !s.checked[i] : !(s.ans[i]&&s.ans[i].length); if(open){ go(pos); return; } }
  openSummary();
}
function toggleFlag(){ var s=S.session, i=curQ(); if(s.flags[i]) delete s.flags[i]; else s.flags[i]=true; save(); render(); toast(s.flags[i]?'Flagged for review':'Flag removed'); }
function choose(j){
  var s=S.session, i=curQ(), q=Q[i]; if(revealed(i)) return;
  var a=(s.ans[i]||[]).slice();
  if(q.type==='mc') a=[j]; else { var k=a.indexOf(j); if(k>=0) a.splice(k,1); else a.push(j); }
  if(a.length) s.ans[i]=a; else delete s.ans[i];
  save(); renderQuiz(j); renderChrome();
}
function clearAns(){ var s=S.session, i=curQ(); if(revealed(i)) return; delete s.ans[i]; save(); render(); }
function check(){ var s=S.session, i=curQ(); if(!sel(i).length) return; s.checked[i]=true; save(); render(); var v=document.querySelector('.verdict'); if(v){ v.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'}); } }
function openSummary(){ S.view='summary'; S.confirm=false; render(); window.scrollTo(0,0); }
function finish(){ var s=S.session; s.finished=true; s.finishedAt=Date.now(); S.view='results'; S.confirm=false; save(); render(); window.scrollTo(0,0); }

/* ---------- toast ---------- */
var toastT;
function toast(msg){ var t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){t.hidden=true;},1600); }

/* ---------- render: chrome ---------- */
function render(){
  ['vStart','vQuiz','vSummary','vResults','vReview'].forEach(function(id){ $(id).hidden=true; });
  if(S.view==='start'){ renderStart(); $('vStart').hidden=false; }
  else if(S.view==='quiz'){ renderQuiz(); $('vQuiz').hidden=false; }
  else if(S.view==='summary'){ renderSummary(); $('vSummary').hidden=false; }
  else if(S.view==='results'){ renderResults(); $('vResults').hidden=false; }
  else if(S.view==='review'){ renderReview(); $('vReview').hidden=false; }
  renderChrome();
  if(!$('drawer').hidden) renderDrawer();
}
function renderChrome(){
  var s=S.session, inQuiz=(S.view==='quiz'||S.view==='summary') && s && !s.finished;
  document.body.classList.toggle('in-session', !!(inQuiz||S.view==='review'));
  $('modeChip').hidden=!s||S.view==='start';
  if(s){ $('modeChip').textContent=s.mode==='practice'?'Practice':'Exam'; $('modeChip').className='chip'+(s.mode==='exam'?' exam':''); }
  $('counter').hidden=!inQuiz; $('navBtn').hidden=!inQuiz; $('endBtn').hidden=!inQuiz; $('stripWrap').hidden=!(inQuiz||S.view==='review');
  if(inQuiz){
    var done=0, right=0;
    s.order.forEach(function(i){ if(s.mode==='practice'){ if(s.checked[i]){ done++; if(isCorrect(i)) right++; } } else if(sel(i).length) done++; });
    $('counter').innerHTML = s.mode==='practice'
      ? '<b>'+right+'</b>/'+done+' correct · Q'+(s.cur+1)+' of '+s.order.length
      : 'Q<b>'+(s.cur+1)+'</b> of '+s.order.length+' · '+done+' answered';
    $('endBtn').textContent = s.mode==='practice' ? 'Finish' : 'End exam';
  }
  $('timer').hidden=!(inQuiz && s.timer!=='off');
  updateTimer();
  if(inQuiz||S.view==='review') renderStrip();
  renderActions();
}
function updateTimer(){
  var s=S.session; if(!s||s.timer==='off') return;
  var t=$('timer');
  if(s.timer==='down'){ var left=s.limit-s.elapsed; t.textContent=fmtTime(left)+' left'; t.classList.toggle('low',left<=300); }
  else { t.textContent=fmtTime(s.elapsed); t.classList.remove('low'); }
}
function renderStrip(){
  var s=S.session, strip=$('strip');
  var html='<span class="handle" aria-hidden="true"></span>';
  var curI = S.view==='review' ? S.review.list[S.review.pos] : curQ();
  s.order.forEach(function(i,pos){
    var st=status(i), cls='pad '+st+(s.flags[i]?' flagged':'')+(i===curI?' cur':'');
    html+='<button class="'+cls+'" data-pos="'+pos+'" aria-label="Question '+(pos+1)+', '+st+(s.flags[i]?', flagged':'')+'" tabindex="-1"></button>';
  });
  strip.innerHTML=html;
}

/* ---------- start view ---------- */
function renderStart(){
  var st=S.settings, s=S.session;
  var p=pool(), nS=p.filter(function(i){return Q[i].type==='sata';}).length, nM=p.length-nS;
  var n=st.count==='all'?p.length:Math.min(+st.count,p.length);
  var h='';
  h+='<div class="hero"><div class="eyebrow">Genitourinary · Renal · Pediatric GU</div><h1>GU &amp; Renal NCLEX Practice</h1>';
  h+='<p>100 Next Gen NCLEX-style questions built from your GU Class 1 and Class 2 study guides. Every answer choice has its own rationale, plus a key point to remember.</p>';
  h+='<div class="composition"><span>100 questions</span><span>60 select all that apply</span><span>40 multiple choice</span><span>'+TOPICS.length+' topics</span></div></div>';
  if(s && !s.finished){
    var answered=s.order.filter(function(i){return s.mode==='practice'?s.checked[i]:sel(i).length;}).length;
    h+='<div class="panel resume" style="margin-bottom:18px"><div><strong>Pick up where you left off</strong><p>'+(s.mode==='practice'?'Practice':'Exam')+' session · '+answered+' of '+s.order.length+' done · on question '+(s.cur+1)+'</p></div><div class="rowbtns"><button class="btn primary" data-act="resume">Resume</button><button class="btn" data-act="discard">Discard</button></div></div>';
  } else if(s && s.finished){
    h+='<div class="panel resume" style="margin-bottom:18px;border-left-color:var(--accent)"><div><strong>Your last session is scored</strong><p>'+(s.mode==='practice'?'Practice':'Exam')+' · '+s.order.length+' questions</p></div><div class="rowbtns"><button class="btn" data-act="lastresults">View results</button></div></div>';
  }
  h+='<div class="stack">';
  h+='<div class="panel"><p class="section-label">Mode</p><div class="modes" role="radiogroup" aria-label="Mode">';
  h+='<button class="mode" role="radio" id="mode-practice" aria-checked="'+(st.mode==='practice')+'" data-mode="practice"><strong>Practice mode</strong><span>Check each answer as you go. The rationale for every choice appears right after you submit.</span></button>';
  h+='<button class="mode" role="radio" id="mode-exam" aria-checked="'+(st.mode==='exam')+'" data-mode="exam"><strong>Exam mode</strong><span>No feedback until you submit, like test day. You can still flag, skip, go back, and change answers. Rationales open in the review.</span></button>';
  h+='</div></div>';

  h+='<div class="panel stack"><div class="fields">';
  h+='<div class="field"><label for="f-count">Number of questions</label><select id="f-count">'+
     [['all','All in pool'],['75','75'],['50','50'],['25','25'],['10','10']].map(function(o){return '<option value="'+o[0]+'"'+(st.count===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></div>';
  h+='<div class="field"><span class="lbl" id="lbl-type">Question type</span><div class="seg" role="group" aria-labelledby="lbl-type">'+
     [['both','Both'],['sata','SATA only'],['mc','MC only']].map(function(o){return '<button id="type-'+o[0]+'" data-type="'+o[0]+'" aria-pressed="'+(st.type===o[0])+'">'+o[1]+'</button>';}).join('')+'</div></div>';
  h+='<div class="field"><label for="f-timer">Timer</label><select id="f-timer">'+
     [['off','Off'],['up','Stopwatch (count up)'],['down','Countdown (90 sec per question)']].map(function(o){return '<option value="'+o[0]+'"'+(st.timer===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></div>';
  h+='</div><div class="toggles"><label class="check"><input type="checkbox" id="f-shufq"'+(st.shuffleQ?' checked':'')+'> Shuffle question order</label><label class="check"><input type="checkbox" id="f-shufo"'+(st.shuffleO?' checked':'')+'> Shuffle answer choices</label></div></div>';

/* ---------- question view ---------- */
function optHTML(i, j, letterIdx, opts){
  var q=Q[i], o=q.opts[j], a=opts.ans||[], picked=a.indexOf(j)>=0, show=opts.reveal;
  var cls='opt '+q.type;
  var tag='';
  if(show){
    if(o.c && picked){ cls+=' is-correct'; tag='<span class="tag ok">Correct · your answer</span>'; }
    else if(o.c){ cls+=' is-correct is-missed'; tag='<span class="tag miss">Correct · missed</span>'; }
    else if(picked){ cls+=' is-wrong'; tag='<span class="tag bad">Incorrect · your answer</span>'; }
  }
  var role=q.type==='mc'?'radio':'checkbox';
  var h='<button class="'+cls+'" role="'+role+'" aria-checked="'+picked+'" data-opt="'+j+'"'+(show?' disabled':'')+'>';
  h+='<span class="box" aria-hidden="true">'+(picked&&!show?(q.type==='mc'?'●':'✓'):LET[letterIdx])+'</span>';
  h+='<span class="otext"><span class="sr">'+LET[letterIdx]+'. </span>'+esc(o.t)+'</span>';
  if(show) h+='<span class="why">'+tag+esc(o.w)+'</span>';
  h+='</button>';

}
function verdictHTML(i){
  var q=Q[i], a=sel(i), cls, title;
  if(!a.length){ cls='none'; title='Not answered'; }
  else if(isCorrect(i,a)){ cls='ok'; title='Correct'; }
  else { cls='bad'; title='Incorrect'; }
  var h='<div class="verdict '+cls+'" aria-live="polite"><h3>'+title+'</h3>';
  if(q.type==='sata'){
    var p=0,m=0; a.forEach(function(j){ if(q.opts[j].c) p++; else m++; });
    h+='<p class="scoreline">'+q.correct.length+' correct options. You chose '+p+' of them'+(m?' and '+m+' incorrect':'')+'. NGN +/- score: '+Math.max(0,p-m)+'/'+q.correct.length+'</p>';
  }

  h+='<div class="meta-chips"><span>'+esc(q.topic)+'</span><span>'+esc(q.unit)+'</span><span>Clinical judgment: '+esc(q.cj)+'</span></div>';

}
function questionHTML(i, posLabel){

}

/* ---------- results ---------- */
function compute(){
  var s=S.session, r={n:s.order.length,strict:0,part:0,sata:{n:0,c:0,p:0},mc:{n:0,c:0},un:0,topics:{},cj:{},wrong:[],flagged:[]};
  s.order.forEach(function(i){
    var q=Q[i], a=sel(i), c=a.length&&isCorrect(i,a)?1:0, p=a.length?partial(i,a):0;
    if(!a.length) r.un++;
    r.strict+=c; r.part+=p;
    if(q.type==='sata'){ r.sata.n++; r.sata.c+=c; r.sata.p+=p; } else { r.mc.n++; r.mc.c+=c; }
    var t=r.topics[q.topic]||(r.topics[q.topic]={n:0,c:0,ids:[]}); t.n++; t.c+=c; t.ids.push(i);
    var k=r.cj[q.cj]||(r.cj[q.cj]={n:0,c:0,ids:[]}); k.n++; k.c+=c; k.ids.push(i);
    if(!c) r.wrong.push(i);
    if(s.flags[i]) r.flagged.push(i);
  });
  return r;
}
function pct(a,b){ return b?Math.round(a/b*100):0; }
function meterColor(p){ return p>=80?'var(--ok)':p>=65?'var(--flag-pad)':'var(--bad)'; }
function renderResults(){
  var s=S.session, r=compute(), P=pct(r.strict,r.n), PP=pct(r.part,r.n);
  var band=P>=80?['ok','Strong']:P>=65?['mid','Getting close']:['low','Needs more review'];
  var h='<div class="stack">';
  if(s.timedOut) h+='<div class="panel" style="border-left:4px solid var(--bad)"><strong>Time ran out.</strong> Your exam was submitted automatically.</div>';
  h+='<div class="panel scorehead"><div class="ring" style="--p:'+P+';--ring-c:'+meterColor(P)+'"><div><div><div class="pct">'+P+'%</div><div class="sub">Strict</div></div></div></div>';
  h+='<div style="display:grid;gap:6px;min-width:0"><div class="eyebrow">'+(s.mode==='practice'?'Practice':'Exam')+' results</div><div class="band '+band[0]+'">'+band[1]+'</div>';
  h+='<p style="margin:0">'+r.strict+' of '+r.n+' correct under strict scoring. With NGN +/- partial credit on SATA items you earned <b>'+PP+'%</b>.</p>';
  if(r.un) h+='<p class="note">'+r.un+' left unanswered (scored as incorrect).</p>';
  h+='</div></div>';
  h+='<div class="statrow">';
  if(r.sata.n) h+='<div class="stat"><div class="v">'+pct(r.sata.c,r.sata.n)+'%</div><div class="k">SATA strict ('+r.sata.c+'/'+r.sata.n+')</div></div><div class="stat"><div class="v">'+pct(r.sata.p,r.sata.n)+'%</div><div class="k">SATA with partial credit</div></div>';
  if(r.mc.n) h+='<div class="stat"><div class="v">'+pct(r.mc.c,r.mc.n)+'%</div><div class="k">Multiple choice ('+r.mc.c+'/'+r.mc.n+')</div></div>';
  if(s.elapsed) h+='<div class="stat"><div class="v">'+fmtTime(s.elapsed)+'</div><div class="k">Time used'+(r.n?' · '+Math.round(s.elapsed/r.n)+'s per question':'')+'</div></div>';
  h+='</div>';
  h+='<div class="panel"><p class="section-label">Review</p><div class="rowbtns">';
  h+='<button class="btn primary" data-act="rev-wrong"'+(r.wrong.length?'':' disabled')+'>Review missed ('+r.wrong.length+')</button>';
  h+='<button class="btn" data-act="rev-flag"'+(r.flagged.length?'':' disabled')+'>Review flagged ('+r.flagged.length+')</button>';
  h+='<button class="btn" data-act="rev-all">Review all '+r.n+'</button>';
  h+='<button class="btn" data-act="retry"'+(r.wrong.length?'':' disabled')+'>Retry missed in practice mode</button>';
  h+='<button class="btn ghost" data-act="new">New session</button>';
  h+='</div></div>';
  var topics=Object.keys(r.topics).map(function(t){var o=r.topics[t];return {t:t,n:o.n,c:o.c,p:pct(o.c,o.n),ids:o.ids};}).sort(function(a,b){return a.p-b.p||b.n-a.n;});
  h+='<div class="panel"><p class="section-label">By topic, weakest first</p><div class="brk">';
  topics.forEach(function(o){ h+='<button class="brow" data-topicrev="'+esc(o.t)+'"><span class="name">'+esc(o.t)+'<small>'+esc(TOPIC_UNIT[o.t])+'</small></span><span class="frac">'+o.c+'/'+o.n+'</span><span class="meter" aria-label="'+o.p+'%"><i style="width:'+o.p+'%;background:'+meterColor(o.p)+'"></i></span></button>'; });
  h+='</div><p class="note" style="margin-top:8px">Select a topic to review its questions.</p></div>';
  h+='<div class="panel"><p class="section-label">By clinical judgment step</p><div class="brk">';
  CJ.forEach(function(k){ var o=r.cj[k]; if(!o) return; var p=pct(o.c,o.n); h+='<button class="brow" data-cjrev="'+esc(k)+'"><span class="name">'+esc(k)+'</span><span class="frac">'+o.c+'/'+o.n+'</span><span class="meter" aria-label="'+p+'%"><i style="width:'+p+'%;background:'+meterColor(p)+'"></i></span></button>'; });
  h+='</div></div></div>';
  $('vResults').innerHTML=h;
}

/* ---------- review ---------- */
function startReview(list,label){ if(!list.length) return; S.review={list:list,pos:0,label:label}; S.view='review'; save(); render(); window.scrollTo(0,0); }
