/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t) return;
  var s=S.session, st=S.settings, act=t.getAttribute('data-act');
  if(t.hasAttribute('data-opt') && S.view==='quiz'){ choose(+t.getAttribute('data-opt')); return; }
  if(t.hasAttribute('data-mode')){ st.mode=t.getAttribute('data-mode'); save(); renderStart(); return; }
  if(t.hasAttribute('data-type')){ st.type=t.getAttribute('data-type'); save(); renderStart(); return; }
  if(t.hasAttribute('data-topic')){ var tp=t.getAttribute('data-topic'), k=st.topics.indexOf(tp); if(k>=0) st.topics.splice(k,1); else st.topics.push(tp); save(); renderStart(); return; }
  if(t.hasAttribute('data-unit')){ var u=t.getAttribute('data-unit'), ts=TOPICS.filter(function(x){return TOPIC_UNIT[x]===u;}); var allOn=ts.every(function(x){return st.topics.indexOf(x)>=0;}); st.topics=st.topics.filter(function(x){return ts.indexOf(x)<0;}); if(!allOn) st.topics=st.topics.concat(ts); save(); renderStart(); return; }
  if(t.hasAttribute('data-all')){ st.topics=t.getAttribute('data-all')==='1'?TOPICS.slice():[]; save(); renderStart(); return; }
  if(t.hasAttribute('data-pos')){ var pos=+t.getAttribute('data-pos'); if(S.view==='review'){ var qi=s.order[pos], k2=S.review.list.indexOf(qi); if(k2<0){ S.review={list:s.order.slice(),pos:pos,label:'All questions'}; } else S.review.pos=k2; render(); window.scrollTo(0,0); return; } if(!$('drawer').hidden) closeDrawer(); go(pos); return; }
  if(t.hasAttribute('data-tab')){ S.navTab=t.getAttribute('data-tab'); renderDrawer(); return; }
  if(t.hasAttribute('data-topicrev')){ var tn=t.getAttribute('data-topicrev'); startReview(s.order.filter(function(i){return Q[i].topic===tn;}),tn); return; }
  if(t.hasAttribute('data-cjrev')){ var cn=t.getAttribute('data-cjrev'); startReview(s.order.filter(function(i){return Q[i].cj===cn;}),'Clinical judgment: '+cn); return; }
  switch(act){
    case 'start': startFromSettings(); break;
    case 'resume': S.view='quiz'; render(); break;
    case 'discard': S.session=null; S.review=null; save(); renderStart(); toast('Session discarded'); break;
    case 'lastresults': S.view='results'; render(); break;
    case 'back': back(); break;
    case 'next': next(); break;
    case 'skip': skip(); break;
    case 'flag': toggleFlag(); break;
    case 'check': check(); break;
    case 'clear': clearAns(); break;
    case 'return': S.view='quiz'; render(); break;
    case 'goflag': var f=s.order.findIndex(function(i){return s.flags[i];}); if(f>=0) go(f); break;
    case 'trysubmit': var open=s.order.filter(function(i){ return s.mode==='practice' ? !s.checked[i] : !sel(i).length; }).length; if(open){ S.confirm=true; renderSummary(); } else finish(); break;
    case 'noconfirm': S.confirm=false; renderSummary(); break;
    case 'finish': finish(); break;
    case 'rev-wrong': var r1=compute(); startReview(r1.wrong,'Missed questions'); break;
    case 'rev-flag': var r2=compute(); startReview(r2.flagged,'Flagged questions'); break;
    case 'rev-all': startReview(s.order.slice(),'All questions'); break;
    case 'retry': var r3=compute(); S.settings.mode='practice'; newSession(r3.wrong,'practice'); toast('Practice set: '+r3.wrong.length+' missed questions'); break;
    case 'new': S.view='start'; render(); window.scrollTo(0,0); break;
    case 'rprev': if(S.review.pos>0){ S.review.pos--; save(); render(); window.scrollTo(0,0);} break;
    case 'rnext': if(S.review.pos<S.review.list.length-1){ S.review.pos++; save(); render(); window.scrollTo(0,0);} break;
    case 'toresults': S.view='results'; save(); render(); window.scrollTo(0,0); break;
  }
});
document.addEventListener('change',function(e){
  var st=S.settings, id=e.target.id;
  if(id==='f-count'){ st.count=e.target.value; }
  else if(id==='f-timer'){ st.timer=e.target.value; }
  else if(id==='f-shufq'){ st.shuffleQ=e.target.checked; }
  else if(id==='f-shufo'){ st.shuffleO=e.target.checked; }
  else return;
  save(); renderStart(); var el=$(id); if(el) el.focus();
});
$('navBtn').addEventListener('click',openDrawer);
$('drawerClose').addEventListener('click',closeDrawer);
$('scrim').addEventListener('click',closeDrawer);
$('endBtn').addEventListener('click',openSummary);
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.target.matches && e.target.matches('input,select,textarea')) return;
  if(e.key==='Escape' && !$('drawer').hidden){ closeDrawer(); return; }
  if(!$('drawer').hidden) return;
  var s=S.session;
  if(S.view==='quiz' && s && !s.finished){
    var i=curQ(), order=s.optOrder[i]||Q[i].opts.map(function(_,j){return j;});
    if(/^[1-9]$/.test(e.key)){ var k=+e.key-1; if(k<order.length){ e.preventDefault(); choose(order[k]); } return; }
    var k2=e.key.toLowerCase();
    if(k2==='f'){ e.preventDefault(); toggleFlag(); return; }
    if(k2==='s' && !revealed(i)){ e.preventDefault(); skip(); return; }
    if(e.key==='ArrowRight'){ e.preventDefault(); if(s.mode==='practice' && !revealed(i)) skip(); else next(); return; }
    if(e.key==='ArrowLeft'){ e.preventDefault(); back(); return; }
    if(e.key==='Enter'){
      if(e.target.closest && e.target.closest('button') && !e.target.hasAttribute('data-opt')) return;
      e.preventDefault();
      if(s.mode==='practice'){ if(revealed(i)) next(); else check(); } else next();
      return;
    }
  } else if(S.view==='review' && S.review){
    if(e.key==='ArrowRight' && S.review.pos<S.review.list.length-1){ S.review.pos++; render(); window.scrollTo(0,0); }
    if(e.key==='ArrowLeft' && S.review.pos>0){ S.review.pos--; render(); window.scrollTo(0,0); }
  }
});
setInterval(function(){
  var s=S.session; if(!s||s.finished) return;
  if(S.view!=='quiz' && S.view!=='summary') return;
  if(document.hidden) return;
  s.elapsed++; if(s.timer!=='off') updateTimer();
  if(s.timer==='down' && s.elapsed>=s.limit){ s.timedOut=true; finish(); return; }
  if(s.elapsed%5===0) save();
},1000);
window.addEventListener('pagehide',save);

/* ---------- boot ---------- */
function start(data){
  load(data && data.settings ? data : null);
  render();
}
var hot=window.claude && window.claude.hot;
if(hot && hot.snapshot){ try{ hot.snapshot(function(){ return {settings:S.settings,session:S.session,view:S.view==='summary'?'quiz':S.view,review:S.review}; }); }catch(e){} }
if(hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();
</script>
