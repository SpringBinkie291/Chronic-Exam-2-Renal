<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GU &amp; Renal NCLEX Practice</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one exam sheet down the middle. Sticky top bar carries a urinalysis reagent strip (one pad per question) as the progress map; a fixed action bar holds Back / Flag / Skip / Next. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#586473; --line:#D6DCE3;
  --accent:#1E5C7A; --accent-ink:#FFFFFF; --accent-soft:#E0ECF2;
  --flag:#9C6210; --flag-soft:#FAEFD9; --flag-pad:#E0A43C;
  --ok:#2A7548; --ok-soft:#E2F0E7; --bad:#AE3A33; --bad-soft:#F7E3E1;
  --pad-empty:#DFE4EA; --pad-handle:#C9D1DA;
  --shadow:0 1px 2px rgba(21,32,43,.06),0 10px 28px rgba(21,32,43,.07);
  --scrim:rgba(21,32,43,.38);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10161C; --surface:#18212A; --surface-2:#1D2731; --ink:#E4E9EE; --muted:#9AA6B3; --line:#2B3641;
  --accent:#74B6D6; --accent-ink:#0D1A22; --accent-soft:#1B3341;
  --flag:#E7B25A; --flag-soft:#3A2D15; --flag-pad:#E7B25A;
  --ok:#72C493; --ok-soft:#17301F; --bad:#EE8A83; --bad-soft:#3B1E1C;
  --pad-empty:#2A3540; --pad-handle:#34414E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25);
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10161C; --surface:#18212A; --surface-2:#1D2731; --ink:#E4E9EE; --muted:#9AA6B3; --line:#2B3641;
  --accent:#74B6D6; --accent-ink:#0D1A22; --accent-soft:#1B3341;
  --flag:#E7B25A; --flag-soft:#3A2D15; --flag-pad:#E7B25A;
  --ok:#72C493; --ok-soft:#17301F; --bad:#EE8A83; --bad-soft:#3B1E1C;
  --pad-empty:#2A3540; --pad-handle:#34414E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25);
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap;padding-block:8px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.bar-spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.exam{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.counter{font-family:var(--f-mono);font-size:14px;color:var(--muted);white-space:nowrap}
.counter b{color:var(--ink);font-weight:600}
.timer{font-family:var(--f-mono);font-weight:600;font-size:15px;padding:4px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.timer.low{color:var(--bad);border-color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover:not(:disabled){background:var(--surface-2);border-color:var(--line)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn.flag[aria-pressed="true"]{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.btn svg{width:18px;height:18px;flex:none}

/* reagent strip */
.strip-wrap{padding-bottom:10px}
.strip{display:flex;align-items:stretch;gap:2px;height:14px;padding:2px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.strip .handle{flex:0 0 22px;border-radius:2px;background:var(--pad-handle)}
.pad{flex:1 1 0;min-width:0;border:0;padding:0;border-radius:2px;background:var(--pad-empty);position:relative}
.pad.answered{background:var(--accent)}
.pad.skipped{background:repeating-linear-gradient(45deg,var(--pad-empty) 0 2px,var(--muted) 2px 3px)}
.pad.correct{background:var(--ok)}
.pad.incorrect{background:var(--bad)}
.pad.unanswered{background:var(--pad-empty);box-shadow:inset 0 0 0 1px var(--bad)}
.pad.flagged::after{content:"";position:absolute;left:0;right:0;top:-4px;height:3px;border-radius:2px;background:var(--flag-pad)}
.pad.cur{outline:2px solid var(--ink);outline-offset:1px;z-index:1}
.strip-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.strip-legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block;background:var(--pad-empty)}
.sw.a{background:var(--accent)} .sw.ok{background:var(--ok)} .sw.bad{background:var(--bad)} .sw.f{background:var(--flag-pad)}
.sw.s{background:repeating-linear-gradient(45deg,var(--pad-empty) 0 2px,var(--muted) 2px 3px)}

/* ---------- main views ---------- */
main{padding-block:24px 140px}
.view[hidden]{display:none}

/* start */
.hero{display:grid;gap:10px;padding-block:8px 20px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:clamp(30px,6vw,46px);font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted);max-width:62ch}
.composition{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.composition span{font-family:var(--f-mono);font-size:13px;padding:4px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.stack{display:grid;gap:18px}
.section-label{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mode{display:grid;gap:6px;text-align:left;padding:16px;border-radius:12px;border:2px solid var(--line);background:var(--surface)}
.mode strong{font-family:var(--f-display);font-size:19px;font-weight:800}
.mode span{color:var(--muted);font-size:14.5px}
.mode[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mode[aria-checked="true"] span{color:var(--ink)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field label,.field .lbl{font-weight:700;font-size:14px}
select{min-height:42px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;min-height:40px;border:0;background:var(--surface);font-weight:700;font-size:14px;padding:6px 8px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toggles{display:flex;flex-wrap:wrap;gap:10px 22px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.topic-group{display:grid;gap:8px}
.topic-group+.topic-group{margin-top:14px}
.tg-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tg-head h3{font-size:16px;font-weight:800}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:13.5px;padding:2px 4px;text-decoration:underline;text-underline-offset:2px}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.tchip .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.tchip[aria-pressed="true"] .n{color:var(--accent)}
.startbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
.pool{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.pool b{color:var(--ink)}
.note{font-size:14px;color:var(--muted);margin:0}
.kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface-2);color:var(--ink)}
.resume{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-left:4px solid var(--flag)}
.resume p{margin:2px 0 0;color:var(--muted);font-size:14.5px}

/* question */
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.qnum{font-family:var(--f-mono);font-weight:600;font-size:14px;color:var(--muted)}
.qtype{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.qtype.sata{color:var(--accent);border-color:var(--accent)}
.flagnote{font-size:13px;font-weight:700;color:var(--flag);display:inline-flex;gap:5px;align-items:center}
.flagnote svg{width:15px;height:15px}
.stem{font-family:var(--f-body);font-weight:700;font-size:clamp(18px,2.6vw,20px);line-height:1.5;margin:0 0 18px;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;width:100%;text-align:left;padding:13px 14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .box{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--muted);font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--muted);margin-top:1px}
.opt.sata .box{border-radius:6px}
.opt.mc .box{border-radius:50%}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.otext{font-size:16.5px;min-width:0}
.why{display:block;grid-column:2;font-size:14.5px;color:var(--muted);margin:4px 0 0;line-height:1.5}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:5px;margin-right:6px;vertical-align:1px}
.opt.is-correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-correct .box{border-color:var(--ok);color:var(--ok)}
.opt.is-correct[aria-checked="true"] .box{background:var(--ok);color:var(--accent-ink);border-color:var(--ok)}
.opt.is-correct .why{color:var(--ink)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.is-wrong .box{background:var(--bad);border-color:var(--bad);color:var(--accent-ink)}
.opt.is-missed{border-style:dashed}
.tag.ok{background:var(--ok);color:var(--accent-ink)}
.tag.bad{background:var(--bad);color:var(--accent-ink)}
.tag.miss{background:transparent;color:var(--ok);border:1px solid var(--ok)}
.verdict{margin-top:18px;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;gap:10px}
.verdict h3{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
.verdict.ok h3{color:var(--ok)} .verdict.bad h3{color:var(--bad)} .verdict.none h3{color:var(--muted)}
.verdict p{margin:0}
.scoreline{font-family:var(--f-mono);font-size:13.5px;color:var(--muted)}
.keypoint{border-left:4px solid var(--accent);background:var(--surface-2);padding:10px 14px;border-radius:0 8px 8px 0}
.keypoint b{display:block;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.meta-chips{display:flex;flex-wrap:wrap;gap:6px}
.meta-chips span{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.clearlink{margin-left:auto}

/* action bar */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.actions .wrap{display:flex;align-items:center;gap:8px;padding-block:10px;flex-wrap:wrap}
.actions .grow{flex:1}
.hint{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;padding-bottom:8px}
@media (max-width:560px){ .hint{display:none} .btn .lbl-long{display:none} .actions .btn{padding:8px 12px} .brand small{display:none} }
@media (max-width:400px){ .actions .btn .lbl-mid{display:none} .actions .wrap{gap:6px} }
@media (max-width:560px){ body.in-session .brand, body.in-session #modeChip, .nav-lbl{display:none} .bar-row{gap:8px;min-height:48px} .counter{font-size:13px} .bar-spacer{display:none} #counter{flex:1;min-width:0} }

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer-head h2{font-size:19px;font-weight:800;flex:1}
.drawer-body{overflow:auto;padding:16px;display:grid;gap:14px;align-content:start}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.cell{position:relative;height:42px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-weight:600;font-size:14px}
.cell.answered{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.cell.skipped{border-style:dashed;border-color:var(--muted)}
.cell.correct{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.incorrect{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.unanswered{border-style:dashed;border-color:var(--bad);color:var(--bad)}
.cell.flagged::after{content:"";position:absolute;top:3px;right:3px;width:0;height:0;border-left:9px solid transparent;border-top:9px solid var(--flag-pad);border-top-right-radius:4px}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.empty-note{color:var(--muted);font-size:14.5px;margin:0}

/* summary */
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.stat .v{font-family:var(--f-mono);font-size:26px;font-weight:600;line-height:1.1}
.stat .k{font-size:13px;color:var(--muted);margin-top:4px}
.stat.warn .v{color:var(--bad)} .stat.flag .v{color:var(--flag)}
.confirm{border:1.5px solid var(--bad);background:var(--bad-soft);border-radius:12px;padding:14px;display:grid;gap:10px}
.confirm p{margin:0}
.rowbtns{display:flex;flex-wrap:wrap;gap:10px}

/* results */
.scorehead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.ring{--p:0;width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--ring-c,var(--accent)) calc(var(--p)*1%),var(--pad-empty) 0);display:grid;place-items:center}
.ring>div{width:104px;height:104px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
.ring .pct{font-family:var(--f-mono);font-weight:600;font-size:28px;line-height:1}
.ring .sub{font-size:11.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:2px}
.band{font-family:var(--f-display);font-weight:800;font-size:24px}
.band.ok{color:var(--ok)} .band.mid{color:var(--flag)} .band.low{color:var(--bad)}
@media (max-width:480px){ .scorehead{grid-template-columns:1fr;justify-items:start} }
.brk{display:grid;gap:4px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(80px,32%);gap:12px;align-items:center;padding:9px 8px;border-radius:8px;border:0;background:none;text-align:left;width:100%}
.brow:hover{background:var(--surface-2)}
.brow .name{min-width:0;font-size:15px}
.brow .name small{display:block;color:var(--muted);font-size:12.5px}
.brow .frac{font-family:var(--f-mono);font-size:13.5px;color:var(--muted);text-align:right}
.meter{height:10px;border-radius:5px;background:var(--pad-empty);overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px}
.reviewbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.reviewbar .lbl{font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14.5px;box-shadow:var(--shadow)}
@media (prefers-reduced-motion: no-preference){
  .opt,.pad,.cell{transition:background .15s,border-color .15s}
  .verdict{animation:rise .22s ease-out}
  @keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
}
</style>
<style>html{color-scheme:light dark}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="wrap">
    <div class="bar-row">
      <div class="brand">GU &amp; Renal NCLEX<small>GU Class 1 &amp; 2</small></div>
      <span class="chip" id="modeChip" hidden></span>
      <div class="bar-spacer"></div>
      <span class="counter" id="counter" hidden></span>

<script id="qdata" type="application/json">[{"topic":"GU A&P","unit":"Genitourinary","type":"sata","cj":"Analyze Cues","stem":"A nurse is precepting a nursing student who is caring for a client with low blood pressure. The student explains how the renin-angiotensin-aldosterone system (RAAS) responds. Which statements by the student are accurate? Select all that apply.","opts":[{"t":"“Angiotensin I is converted to angiotensin II, mainly in the lungs.”","c":true,"w":"Correct. Angiotensin converting enzyme (ACE), found mostly in the lungs, makes angiotensin II."},{"t":"“Aldosterone released from the adrenal cortex causes sodium and water retention.”","c":true,"w":"Correct. Aldosterone increases sodium reabsorption in the distal tubule, water follows, and blood volume rises."},{"t":"“Renin converts angiotensinogen, which is made by the liver, into angiotensin I.”","c":true,"w":"Correct. Renin acts as an enzyme on angiotensinogen, a protein synthesized by the liver."},{"t":"“Aldosterone causes the kidneys to hold on to potassium.”","c":false,"w":"Incorrect. Aldosterone trades sodium for potassium, so potassium is excreted. Blocking this system (ACE inhibitors, spironolactone) is why those drugs can raise potassium."},{"t":"“Renin is released by the kidneys when blood pressure or renal perfusion drops.”","c":true,"w":"Correct. The juxtaglomerular cells of the kidney secrete renin when they sense decreased perfusion or pressure."},{"t":"“Angiotensin II dilates blood vessels to improve blood flow to the kidneys.”","c":false,"w":"Incorrect. Angiotensin II is a powerful vasoconstrictor that raises BP. Renal vasodilation comes from the prostaglandins (PGE2 and prostacyclin) the kidneys make."}],"take":"RAAS: renin (kidney) → angiotensin I → angiotensin II (ACE in lungs) → vasoconstriction plus aldosterone (sodium and water kept, potassium excreted)."},{"topic":"GU A&P","unit":"Genitourinary","type":"mc","cj":"Analyze Cues","stem":"A 70-year-old client with osteoarthritis has taken ibuprofen 800 mg three times daily for months and is admitted with 2 days of vomiting. Serum creatinine has risen from 1.0 to 2.1 mg/dL. The nurse understands that NSAID use combined with dehydration harms the kidneys mainly because NSAIDs:","opts":[{"t":"Suppress erythropoietin production, reducing oxygen delivery to the nephrons","c":false,"w":"Incorrect. Erythropoietin drives RBC production. Its loss causes anemia in CKD, not acute NSAID related injury."},{"t":"Block prostaglandins that dilate renal blood vessels and maintain renal blood flow","c":true,"w":"Correct. The kidneys make prostaglandin E2 and prostacyclin, which vasodilate and protect renal blood flow, especially when volume is low. NSAIDs inhibit prostaglandin synthesis, so perfusion to the kidney falls."},{"t":"Stimulate excess ADH release, causing the kidneys to retain water","c":false,"w":"Incorrect. NSAIDs do not act through ADH, and water retention would not explain a rising creatinine in a dehydrated client."},{"t":"Damage the glomerular basement membrane through trapped immune complexes","c":false,"w":"Incorrect. Immune complexes trapped in the glomerulus describe post-streptococcal glomerulonephritis, not NSAID injury."}],"take":"Dehydration plus NSAIDs is a classic setup for kidney injury in older adults. Hold the NSAID and report the rising creatinine."},{"topic":"GU A&P","unit":"Genitourinary","type":"sata","cj":"Recognize Cues","stem":"The nurse is teaching a community group how the urinary tract normally defends itself against infection. Which factors protect against urinary tract infection? Select all that apply.","opts":[{"t":"The flow of urine through the urethra washes bacteria out","c":true,"w":"Correct. Normal urine flow flushes bacteria out of the urethra."},{"t":"A female urethra that is 1.5 to 2 inches long","c":false,"w":"Incorrect. The short female urethra is a risk factor. Bacteria from the perineum reach the bladder easily."},{"t":"The ureters enter the bladder wall at an angle, which compresses them during voiding","c":true,"w":"Correct. The oblique entry at the ureterovesical junction prevents reflux of urine back toward the kidneys during voiding."},{"t":"Complete emptying of the bladder with each void","c":true,"w":"Correct. Complete emptying prevents stasis. Residual urine is a growth medium for bacteria."},{"t":"Acidic urine pH","c":true,"w":"Correct. A low urine pH, along with high urea content, inhibits bacterial growth."},{"t":"A post-void residual volume of 250 mL","c":false,"w":"Incorrect. A large residual means stasis, which increases infection risk."}],"take":"Anything that causes stasis or reflux, or that bypasses normal defenses (catheters, obstruction, incomplete emptying), raises UTI risk."},{"topic":"GU A&P","unit":"Genitourinary","type":"mc","cj":"Take Action","stem":"Six hours after abdominal surgery, a client reports an urge to urinate but has been unable to void. The nurse palpates a firm, rounded mass above the symphysis pubis. Which action should the nurse take first?","opts":[{"t":"Restrict oral fluids until the client voids","c":false,"w":"Incorrect. Restricting fluids does not relieve retention and risks dehydration."},{"t":"Notify the surgeon that the client has developed acute kidney injury","c":false,"w":"Incorrect. The kidneys are making urine; it is being held in the bladder. This is a lower tract retention problem, not decreased urine production."},{"t":"Insert an indwelling urinary catheter","c":false,"w":"Incorrect. Catheterization may be needed, but assess first and try measures to promote voiding. Catheters carry infection risk."},{"t":"Use a portable bladder scanner to estimate the volume of urine in the bladder","c":true,"w":"Correct. A distended bladder rises above the symphysis pubis. A bladder scan quickly and noninvasively confirms retention and measures the volume before any decision about catheterization."}],"take":"Not voiding is not the same as not making urine. Assess the bladder before assuming a kidney problem."},{"topic":"GU A&P","unit":"Genitourinary","type":"sata","cj":"Analyze Cues","stem":"A client is bleeding after a motor vehicle crash. BP is 84/50 mm Hg and HR is 124/min. Which compensatory responses would the nurse expect from the kidneys? Select all that apply.","opts":[{"t":"Concentrated urine with a high specific gravity","c":true,"w":"Correct. ADH increases water reabsorption in the distal tubules and collecting ducts, so the small amount of urine produced is concentrated."},{"t":"Dilute urine with a specific gravity of 1.002","c":false,"w":"Incorrect. Dilute urine would mean the kidneys are not conserving water, which is not the expected response to blood loss."},{"t":"Increased sodium excretion in the urine","c":false,"w":"Incorrect. In hypovolemia the kidneys hold on to sodium, so urine sodium is low."},{"t":"Sodium and water reabsorption from increased aldosterone","c":true,"w":"Correct. Aldosterone conserves sodium, and water follows, to restore circulating volume."},{"t":"Release of renin","c":true,"w":"Correct. Low BP and decreased renal perfusion trigger renin release and activate RAAS."},{"t":"Urine output less than 30 mL/hr","c":true,"w":"Correct. The kidneys conserve volume and perfusion falls, so output drops. Hourly output is a sensitive perfusion indicator."}],"take":"Hypovolemia → RAAS plus ADH → small volume of concentrated urine. Output below 30 mL/hr (0.5 mL/kg/hr) needs follow-up."},{"topic":"UTI: Diagnosis & Treatment","unit":"Genitourinary","type":"sata","cj":"Recognize Cues","stem":"A nurse in a memory care unit is caring for an 84-year-old resident with dementia whose daughter says she is “not herself.” Over the past 24 hours the resident has become more agitated and fell once. Temperature is 98.9°F (37.2°C). Which findings support the nurse's suspicion of a urinary tract infection? Select all that apply.","opts":[{"t":"Acute increase in confusion compared with her baseline","c":true,"w":"Correct. In older adults, a sudden change in mental status is often the first or only sign of UTI. Always rule out UTI when confusion changes suddenly."},{"t":"New episodes of urinary incontinence","c":true,"w":"Correct. New or worsening incontinence is a common atypical presentation of UTI in older adults."},{"t":"Cloudy, foul-smelling urine","c":true,"w":"Correct. Cloudy urine with an odor suggests bacteria and pyuria."},{"t":"Vague abdominal discomfort instead of burning on urination","c":true,"w":"Correct. Older adults are more likely to report nonlocalized discomfort than classic dysuria."},{"t":"Gradual memory decline over the last 3 years","c":false,"w":"Incorrect. Slow, progressive decline fits her dementia, not an acute infection."},{"t":"No fever, which rules out an infection","c":false,"w":"Incorrect. Older adults often have a blunted fever response. A normal temperature does not rule out UTI."}],"take":"Older adult with a sudden behavior change, falls, or new incontinence: think UTI, even without fever."},{"topic":"UTI: Diagnosis & Treatment","unit":"Genitourinary","type":"mc","cj":"Take Action","stem":"A client with a suspected UTI has new prescriptions for a urinalysis, urine culture and sensitivity, phenazopyridine, and oral trimethoprim-sulfamethoxazole (TMP-SMX). The client has not voided yet. Which action should the nurse take first?","opts":[{"t":"Give phenazopyridine for comfort before collecting the urine","c":false,"w":"Incorrect. Phenazopyridine turns urine reddish orange and interferes with dipstick color reactions. Collect the specimen first."},{"t":"Have the client drink 1 L of water quickly to produce a specimen","c":false,"w":"Incorrect. A large fluid load dilutes the specimen and can lower colony counts."},{"t":"Obtain a clean-catch midstream urine specimen","c":true,"w":"Correct. Collect the culture before antibiotics so the organism and its sensitivities can be identified accurately."},{"t":"Give the first dose of TMP-SMX so treatment is not delayed","c":false,"w":"Incorrect. Starting the antibiotic first can lower bacterial counts and cause a false negative culture."}],"take":"Culture first, antibiotics second. This applies to cystitis, pyelonephritis, and urosepsis."},{"topic":"UTI: Diagnosis & Treatment","unit":"Genitourinary","type":"sata","cj":"Generate Solutions","stem":"A 29-year-old client has had three episodes of cystitis this year. Which instructions should the nurse include to help prevent recurrence? Select all that apply.","opts":[{"t":"Use a vaginal douche after menstruation to reduce bacteria","c":false,"w":"Incorrect. Douches disrupt normal flora and irritate tissue. Avoid them."},{"t":"Stop the antibiotic once the burning goes away","c":false,"w":"Incorrect. Stopping early promotes recurrence and resistance. Take every dose as prescribed."},{"t":"Wipe from front to back after toileting","c":true,"w":"Correct. This keeps fecal bacteria (E. coli is the most common cause of UTI) away from the urethra."},{"t":"Empty your bladder before and after sexual intercourse","c":true,"w":"Correct. Intercourse can push bacteria toward the urethra; voiding afterward flushes them out."},{"t":"Take warm bubble baths to soothe irritation","c":false,"w":"Incorrect. Bubble baths, powders, and sprays irritate the urethra and perineum."},{"t":"Void about every 3 to 4 hours during the day","c":true,"w":"Correct. Regular voiding prevents stasis and flushes bacteria."},{"t":"Maintain adequate fluid intake throughout the day","c":true,"w":"Correct. Adequate fluids increase urine flow and help flush bacteria, unless contraindicated."}],"take":"UTI prevention: hygiene, void regularly and after intercourse, adequate fluids, avoid irritants, finish the antibiotic."},{"topic":"UTI: Diagnosis & Treatment","unit":"Genitourinary","type":"sata","cj":"Evaluate Outcomes","stem":"The nurse teaches a client about phenazopyridine prescribed for UTI discomfort. Which client statements indicate understanding? Select all that apply.","opts":[{"t":"“This medicine treats the infection, so I can skip the antibiotic.”","c":false,"w":"Incorrect. Phenazopyridine is a urinary analgesic only. It does not kill bacteria."},{"t":"“I should call my provider if my skin or the whites of my eyes turn yellow.”","c":true,"w":"Correct. Yellowing can mean the drug is accumulating, often from reduced kidney function, and should be reported."},{"t":"“My soft contact lenses could be stained while I take it.”","c":true,"w":"Correct. The dye can permanently discolor soft contact lenses."},{"t":"“My urine will turn reddish orange, and it can stain my underwear.”","c":true,"w":"Correct. This is an expected, harmless effect, but it stains fabric."},{"t":"“I should only take this for about 2 days.”","c":true,"w":"Correct. Use is short term so it does not mask the symptoms of an untreated infection."},{"t":"“I will take it after meals.”","c":true,"w":"Correct. Taking it with or after food reduces GI upset."},{"t":"“I can use home urine dipsticks to check whether my infection is gone.”","c":false,"w":"Incorrect. The dye interferes with color-based urine tests and gives inaccurate results."}],"take":"Phenazopyridine: symptom relief only, orange urine, short course, interferes with dipstick results."},{"topic":"UTI: Diagnosis & Treatment","unit":"Genitourinary","type":"mc","cj":"Recognize Cues","stem":"A client started nitrofurantoin 4 days ago for cystitis. Which statement by the client requires follow-up?","opts":[{"t":"“My urine looks darker, almost brownish.”","c":false,"w":"Incorrect. Nitrofurantoin can turn urine dark yellow or brown. This is expected."},{"t":"“I have a new dry cough and get short of breath walking to the mailbox.”","c":true,"w":"Correct. Nitrofurantoin can cause acute pulmonary reactions (fever, cough, dyspnea). These need prompt reporting."},{"t":"“I plan to finish every capsule even though I feel better.”","c":false,"w":"Incorrect. This is correct. Completing the course prevents recurrence."},{"t":"“I take each dose with food or a glass of milk.”","c":false,"w":"Incorrect. This is correct practice. Food improves absorption and reduces GI upset."}],"take":"Nitrofurantoin: take with food, brown urine is expected, report respiratory symptoms or numbness and tingling. Avoid with significant kidney impairment."},{"topic":"UTI: Diagnosis & Treatment","unit":"Genitourinary","type":"sata","cj":"Generate Solutions","stem":"A client with a complicated UTI is prescribed ciprofloxacin 500 mg twice daily for 10 days. Which instructions should the nurse include? Select all that apply.","opts":[{"t":"Take each dose with a glass of milk to prevent stomach upset","c":false,"w":"Incorrect. Calcium in dairy taken alone with the dose decreases absorption."},{"t":"Take ciprofloxacin 2 hours before or 6 hours after antacids, iron, or calcium supplements","c":true,"w":"Correct. Magnesium, aluminum, calcium, iron, and zinc bind fluoroquinolones and sharply reduce absorption."},{"t":"Use sunscreen and protective clothing outdoors","c":true,"w":"Correct. Photosensitivity is a known adverse effect."},{"t":"Report pain, swelling, or a popping sensation in the back of the heel right away","c":true,"w":"Correct. Fluoroquinolones carry a boxed warning for tendinitis and Achilles tendon rupture, especially in older adults and clients taking corticosteroids."},{"t":"Report frequent, watery diarrhea","c":true,"w":"Correct. Antibiotics, including fluoroquinolones, can cause C. difficile infection."},{"t":"Stop after 3 days because that is the standard UTI course","c":false,"w":"Incorrect. Three days is for uncomplicated UTI. Complicated UTI treated with a fluoroquinolone usually lasts 7 to 14 days or longer."}],"take":"Complicated UTI means a longer course (7 to 14 days), often a fluoroquinolone. Teach tendon, sun, mineral spacing, and C. diff precautions."},{"topic":"UTI: Diagnosis & Treatment","unit":"Genitourinary","type":"mc","cj":"Analyze Cues","stem":"A 31-year-old client reports burning on urination, frequency, and suprapubic pressure for 1 day. Temperature is 98.8°F (37.1°C). Urinalysis: nitrite positive, leukocyte esterase positive, WBC 45/hpf, many bacteria, no casts. Which condition does the nurse suspect?","opts":[{"t":"Interstitial cystitis","c":false,"w":"Incorrect. Interstitial cystitis is a diagnosis of exclusion with negative cultures and no evidence of bacteria."},{"t":"Acute pyelonephritis","c":false,"w":"Incorrect. Pyelonephritis adds systemic signs (fever, chills, flank pain, CVA tenderness) and often WBC casts."},{"t":"Asymptomatic bacteriuria","c":false,"w":"Incorrect. The client has symptoms, so this is not asymptomatic."},{"t":"Acute cystitis","c":true,"w":"Correct. Lower urinary tract symptoms with positive nitrite and leukocyte esterase and no systemic signs fit an uncomplicated lower UTI."}],"take":"Positive nitrite (bacteria convert nitrate to nitrite) and leukocyte esterase (pyuria) support UTI. WBC casts point to the kidney."},{"topic":"UTI: Diagnosis & Treatment","unit":"Genitourinary","type":"sata","cj":"Take Action","stem":"A client is prescribed trimethoprim-sulfamethoxazole (TMP-SMX) for cystitis. Which actions by the nurse are appropriate? Select all that apply.","opts":[{"t":"Have the client take each dose with an antacid","c":false,"w":"Incorrect. TMP-SMX does not need an antacid. Spacing away from antacids is a fluoroquinolone teaching point."},{"t":"Ask about an allergy to sulfa drugs before giving the first dose","c":true,"w":"Correct. Sulfamethoxazole is a sulfonamide, so a sulfa allergy is a contraindication."},{"t":"Monitor serum potassium in a client with kidney disease","c":true,"w":"Correct. Trimethoprim can cause hyperkalemia, especially with renal impairment or ACE inhibitor use."},{"t":"Tell the client to expect reddish orange urine","c":false,"w":"Incorrect. That is phenazopyridine (or rifampin), not TMP-SMX."},{"t":"Encourage a full glass of water with each dose","c":true,"w":"Correct. Adequate fluids reduce the risk of crystalluria."},{"t":"Teach the client to report a rash, especially blistering or peeling skin","c":true,"w":"Correct. Sulfonamides can cause Stevens-Johnson syndrome, a medical emergency."}],"take":"TMP-SMX: check sulfa allergy, push fluids, watch for rash (SJS) and hyperkalemia."},{"topic":"Cystitis vs Pyelonephritis","unit":"Genitourinary","type":"sata","cj":"Analyze Cues","stem":"A client is being evaluated for a urinary tract infection. Which findings suggest the infection involves the upper urinary tract (pyelonephritis) rather than the bladder alone? Select all that apply.","opts":[{"t":"Dysuria and frequency","c":false,"w":"Incorrect. Lower urinary tract symptoms occur in both cystitis and pyelonephritis, so they do not tell the two apart."},{"t":"Temperature 102.2°F (39°C) with shaking chills","c":true,"w":"Correct. Systemic signs such as fever and chills indicate upper tract infection."},{"t":"Nausea and vomiting","c":true,"w":"Correct. Systemic symptoms such as nausea, vomiting, and malaise are typical of pyelonephritis."},{"t":"Right costovertebral angle (CVA) tenderness","c":true,"w":"Correct. CVA tenderness to percussion reflects inflammation of the kidney."},{"t":"WBC casts in the urine","c":true,"w":"Correct. Casts form in the renal tubules, so WBC casts indicate kidney (parenchymal) involvement."},{"t":"Suprapubic pressure","c":false,"w":"Incorrect. Suprapubic pressure is localized to the bladder, which points to cystitis."}],"take":"Dysuria and frequency can be either. Fever, chills, N/V, flank pain, CVA tenderness, and WBC casts mean kidney."},{"topic":"Cystitis vs Pyelonephritis","unit":"Genitourinary","type":"mc","cj":"Take Action","stem":"A client is admitted with acute pyelonephritis: temperature 102°F (38.9°C), right flank pain, and WBC casts in the urine. Which prescription should the nurse clarify with the provider?","opts":[{"t":"Acetaminophen 650 mg orally every 6 hours as needed for fever","c":false,"w":"Incorrect. This is appropriate for fever and discomfort and avoids nephrotoxic NSAIDs."},{"t":"Ciprofloxacin IV every 12 hours","c":false,"w":"Incorrect. Fluoroquinolones are appropriate for complicated or upper tract infection."},{"t":"Nitrofurantoin 100 mg orally twice daily for 3 days","c":true,"w":"Correct. A 3-day course is for uncomplicated cystitis. Pyelonephritis needs 7 to 14 days of a drug that reaches therapeutic levels in kidney tissue. Nitrofurantoin concentrates in the bladder and is not used for pyelonephritis."},{"t":"Urine culture and sensitivity before the first antibiotic dose","c":false,"w":"Incorrect. This is appropriate. Culture comes before antibiotics."}],"take":"Match the drug and the duration to the infection. Upper tract or complicated infection needs a longer course of a drug that reaches kidney tissue."},{"topic":"Cystitis vs Pyelonephritis","unit":"Genitourinary","type":"sata","cj":"Take Action","stem":"Which interventions should the nurse include in the plan of care for a client admitted with acute pyelonephritis? Select all that apply.","opts":[{"t":"Teach the client to return for a follow-up urine culture after treatment","c":true,"w":"Correct. A follow-up culture confirms that the infection has cleared."},{"t":"Monitor temperature, heart rate, blood pressure, and mental status closely","c":true,"w":"Correct. Pyelonephritis can progress to urosepsis. Early recognition is the priority."},{"t":"Teach the client to stop the antibiotic once the fever breaks","c":false,"w":"Incorrect. Incomplete treatment risks relapse and chronic pyelonephritis."},{"t":"Keep the client on strict bed rest for 2 weeks","c":false,"w":"Incorrect. Rest helps during the acute phase, but prolonged strict bed rest is unnecessary and adds complications."},{"t":"Give antipyretics and analgesics as prescribed","c":true,"w":"Correct. These relieve fever and flank pain."},{"t":"Encourage fluids of 2 to 3 L/day unless contraindicated","c":true,"w":"Correct. Fluids promote urine flow and help flush bacteria."}],"take":"Pyelonephritis care: culture, antibiotics for the full course, fluids, fever and pain control, and watch for sepsis."},{"topic":"Cystitis vs Pyelonephritis","unit":"Genitourinary","type":"mc","cj":"Evaluate Outcomes","stem":"A client has received IV antibiotics for acute pyelonephritis for 48 hours. Which finding best indicates that treatment is effective?","opts":[{"t":"Afebrile for 24 hours with decreasing flank pain","c":true,"w":"Correct. Resolution of fever and flank pain shows the upper tract infection is responding."},{"t":"Urine is reddish orange","c":false,"w":"Incorrect. That color comes from phenazopyridine and says nothing about infection control."},{"t":"Serum creatinine has increased from 0.9 to 1.5 mg/dL","c":false,"w":"Incorrect. A rising creatinine indicates declining kidney function."},{"t":"Dysuria has improved, but temperature is 101.8°F (38.8°C) and HR is 112/min","c":false,"w":"Incorrect. Persistent fever and tachycardia suggest the infection is not controlled and may be progressing toward sepsis."}],"take":"Evaluate pyelonephritis treatment with systemic signs: fever curve, flank pain, heart rate, and kidney function."},{"topic":"Cystitis vs Pyelonephritis","unit":"Genitourinary","type":"sata","cj":"Analyze Cues","stem":"The nurse reviews the charts of several clients with urinary tract infections. Which clients have a factor that makes the UTI complicated? Select all that apply.","opts":[{"t":"A client with type 2 diabetes","c":true,"w":"Correct. Diabetes is a functional factor that complicates UTI."},{"t":"A healthy 24-year-old woman with her first episode of cystitis","c":false,"w":"Incorrect. This is the classic uncomplicated UTI: the most common type, usually limited to the bladder in an otherwise healthy woman."},{"t":"A 52-year-old man with an indwelling urinary catheter","c":true,"w":"Correct. Catheters are a structural factor that makes a UTI complicated."},{"t":"A client with a kidney stone obstructing the left ureter","c":true,"w":"Correct. Obstruction and stones make a UTI complicated."},{"t":"A client with a spinal cord injury and neurogenic bladder","c":true,"w":"Correct. Neurologic disease that affects bladder emptying makes a UTI complicated."},{"t":"A client with chronic kidney disease","c":true,"w":"Correct. CKD makes a UTI complicated."}],"take":"Complicated UTI means a structural or functional problem: obstruction, stones, catheters, CKD, diabetes, or neurologic disease."},{"topic":"Urethritis","unit":"Genitourinary","type":"sata","cj":"Take Action","stem":"A 22-year-old man reports burning with urination and a thick, yellow urethral discharge for 3 days. He has had two sexual partners in the past month. Which actions should the nurse anticipate? Select all that apply.","opts":[{"t":"Instruct him to abstain from intercourse until he and his partners finish treatment","c":true,"w":"Correct. Abstaining prevents spread and reinfection."},{"t":"Offer testing for HIV and syphilis","c":true,"w":"Correct. One STI raises the likelihood of others, so screening is recommended."},{"t":"Encourage him to have all recent sexual partners evaluated and treated","c":true,"w":"Correct. Untreated partners are the main source of reinfection."},{"t":"Collect specimens for gonorrhea and chlamydia testing","c":true,"w":"Correct. These are the most common causes of urethritis in sexually active men. Thick, purulent yellow discharge is classic for gonorrhea."},{"t":"Tell him his partners only need treatment if they develop symptoms","c":false,"w":"Incorrect. Many partners, especially women with chlamydia, have no symptoms."},{"t":"Explain that his short urethra caused the infection","c":false,"w":"Incorrect. The male urethra is about 8 inches long. A short urethra is a female risk factor."}],"take":"Urethritis in men is usually an STI. Test, treat the client and his partners, abstain until treatment is done, and screen for other STIs."},{"topic":"Urethritis","unit":"Genitourinary","type":"mc","cj":"Analyze Cues","stem":"A 26-year-old woman with a new sexual partner reports dysuria and frequency. Urinalysis shows pyuria, but the routine urine culture shows no growth. She is afebrile and denies night sweats or weight loss. Which condition is most likely?","opts":[{"t":"Acute pyelonephritis","c":false,"w":"Incorrect. There is no fever, flank pain, or positive culture."},{"t":"Interstitial cystitis","c":false,"w":"Incorrect. Interstitial cystitis is defined by bladder pain with negative findings; pyuria is not its hallmark."},{"t":"Genitourinary tuberculosis","c":false,"w":"Incorrect. GU TB also causes sterile pyuria, but you would expect a TB history and systemic signs such as night sweats and weight loss."},{"t":"Urethritis caused by a sexually transmitted organism such as chlamydia","c":true,"w":"Correct. Chlamydia and gonorrhea do not grow on a routine urine culture. Pyuria with a negative culture in a sexually active woman with a new partner suggests urethritis."}],"take":"Dysuria plus pyuria with a negative routine culture: think STI urethritis, or GU TB if the history fits."},{"topic":"Urethritis","unit":"Genitourinary","type":"sata","cj":"Generate Solutions","stem":"A 34-year-old woman has urethritis that the provider believes is caused by chemical irritation. Which instructions should the nurse include? Select all that apply.","opts":[{"t":"Expect a thick discharge, which confirms the diagnosis","c":false,"w":"Incorrect. Women with urethritis often have no discharge. Their symptoms (dysuria, frequency) look like cystitis."},{"t":"Douche after intercourse to wash away irritants","c":false,"w":"Incorrect. Douching irritates tissue and disrupts normal flora."},{"t":"Stop using a spermicide or other product that seems to cause irritation","c":true,"w":"Correct. Spermicides and similar products can irritate the urethra."},{"t":"Report fever, flank pain, or blood in the urine","c":true,"w":"Correct. These suggest the problem is spreading or is something other than simple irritation."},{"t":"Avoid perfumed soaps, bubble baths, and feminine hygiene sprays","c":true,"w":"Correct. These are common chemical irritants of the urethra."}],"take":"Urethritis has many causes: STIs, irritants, and trauma. In women it often mimics cystitis without discharge."},{"topic":"Interstitial Cystitis","unit":"Genitourinary","type":"sata","cj":"Recognize Cues","stem":"Which findings are consistent with interstitial cystitis/painful bladder syndrome (IC/PBS)? Select all that apply.","opts":[{"t":"Suprapubic pain that is temporarily relieved by voiding","c":true,"w":"Correct. Pain usually decreases briefly after voiding, then builds again as the bladder fills."},{"t":"Repeatedly negative urine cultures","c":true,"w":"Correct. IC is not a bacterial infection. Diagnosis is made by excluding other causes."},{"t":"Symptoms that go through remissions and exacerbations","c":true,"w":"Correct. IC is chronic, with flares and remissions."},{"t":"Lasting pain relief after a course of antibiotics","c":false,"w":"Incorrect. Because IC is not bacterial, antibiotics do not relieve it."},{"t":"Urgency and frequency, with more than 60 voids in 24 hours in severe cases","c":true,"w":"Correct. Severe IC can cause voiding more than 60 times a day and night."},{"t":"WBC casts in the urine","c":false,"w":"Incorrect. WBC casts indicate kidney infection or inflammation."},{"t":"Fever with costovertebral angle tenderness","c":false,"w":"Incorrect. These are signs of pyelonephritis, not IC."}],"take":"IC/PBS: bladder pain, urgency, frequency, negative cultures, flares and remissions. It is a diagnosis of exclusion."},{"topic":"Interstitial Cystitis","unit":"Genitourinary","type":"sata","cj":"Generate Solutions","stem":"A client with interstitial cystitis asks which foods and drinks might make the symptoms worse. Which items should the nurse include? Select all that apply.","opts":[{"t":"Red wine","c":true,"w":"Correct. Alcohol is a bladder irritant."},{"t":"Baked chicken","c":false,"w":"Incorrect. Plain, unspiced protein is not a typical trigger."},{"t":"Orange juice","c":true,"w":"Correct. Citrus is acidic and a common bladder irritant."},{"t":"Dark chocolate","c":true,"w":"Correct. Chocolate is a known bladder irritant."},{"t":"Plain water","c":false,"w":"Incorrect. Water is not an irritant and dilutes the urine."},{"t":"Spicy salsa","c":true,"w":"Correct. Spicy foods and tomatoes commonly trigger flares."},{"t":"Cola","c":true,"w":"Correct. Carbonated and caffeinated drinks irritate the bladder."}],"take":"IC triggers: alcohol, caffeine, carbonation, citrus, chocolate, spicy foods, and tomatoes. A food and symptom diary helps identify personal triggers."},{"topic":"Interstitial Cystitis","unit":"Genitourinary","type":"mc","cj":"Take Action","stem":"A client newly diagnosed with interstitial cystitis says, “I hurt so much. How can all my urine cultures be negative?” Which response by the nurse is best?","opts":[{"t":"“Negative cultures mean the infection has moved up into your kidneys.”","c":false,"w":"Incorrect. This is inaccurate and causes unnecessary fear."},{"t":"“The lab may have made an error, so we will keep repeating the cultures until one is positive.”","c":false,"w":"Incorrect. This is inaccurate and delays appropriate treatment."},{"t":"“Negative cultures usually mean the pain is caused by stress.”","c":false,"w":"Incorrect. This dismisses a real inflammatory condition."},{"t":"“Interstitial cystitis is inflammation of the bladder that is not caused by bacteria, so cultures are usually negative. It is diagnosed by ruling out other causes.”","c":true,"w":"Correct. This is accurate, validates the pain, and explains why cultures are negative."}],"take":"IC causes real pain with negative cultures. Validate the pain and explain that it is a diagnosis of exclusion."},{"topic":"Interstitial Cystitis","unit":"Genitourinary","type":"sata","cj":"Generate Solutions","stem":"Which treatments would the nurse expect in the plan of care for a client with interstitial cystitis? Select all that apply.","opts":[{"t":"Bethanechol to stimulate bladder contractions","c":false,"w":"Incorrect. Bethanechol increases bladder contraction and would worsen frequency. It is used for retention and overflow."},{"t":"Long-term prophylactic antibiotics","c":false,"w":"Incorrect. IC is not bacterial, so antibiotics are not effective."},{"t":"An antihistamine such as hydroxyzine","c":true,"w":"Correct. Antihistamines reduce the mast cell activity involved in bladder inflammation."},{"t":"Botulinum toxin (Botox) injected into the bladder wall","c":true,"w":"Correct. Botox is used for refractory symptoms."},{"t":"A tricyclic antidepressant such as amitriptyline","c":true,"w":"Correct. Low-dose tricyclics reduce neuropathic bladder pain and frequency."}],"take":"IC treatment: avoid irritants, tricyclics, antihistamines, analgesics, Botox or cyclosporine for refractory cases, and surgery only when everything else fails."},{"topic":"Interstitial Cystitis","unit":"Genitourinary","type":"mc","cj":"Evaluate Outcomes","stem":"The nurse has taught a client about managing interstitial cystitis. Which statement indicates the teaching was effective?","opts":[{"t":"“I'll take my leftover antibiotics whenever I have a flare.”","c":false,"w":"Incorrect. IC is not bacterial, and leftover antibiotics promote resistance."},{"t":"“I'll keep a 3-day log of when I void, what I eat and drink, and when my pain flares.”","c":true,"w":"Correct. A voiding log and pain record identify personal triggers and guide treatment."},{"t":"“If changing my diet doesn't help, surgery will be the next step.”","c":false,"w":"Incorrect. Surgery is a last resort after medications and other therapies fail."},{"t":"“I'll drink a couple of cups of coffee each morning to flush out my bladder.”","c":false,"w":"Incorrect. Caffeine is a bladder irritant."}],"take":"Nursing focus for IC: pain assessment, diet and lifestyle triggers, and a bladder and pain log."},{"topic":"GU Tuberculosis","unit":"Genitourinary","type":"sata","cj":"Recognize Cues","stem":"A client treated for pulmonary tuberculosis 3 years ago now reports urinary frequency, dysuria, and blood in the urine. Which findings support a diagnosis of genitourinary tuberculosis (GU TB)? Select all that apply.","opts":[{"t":"Purulent urethral discharge after a new sexual partner","c":false,"w":"Incorrect. This suggests STI urethritis."},{"t":"Positive nitrite with E. coli greater than 100,000 CFU/mL","c":false,"w":"Incorrect. This is a typical bacterial UTI result."},{"t":"Low-grade fever, night sweats, and weight loss","c":true,"w":"Correct. These systemic TB symptoms support the diagnosis."},{"t":"Acid-fast bacilli identified in a urine culture for M. tuberculosis","c":true,"w":"Correct. Diagnosis is based on finding M. tuberculosis in the urine."},{"t":"Rapid improvement after a 3-day course of TMP-SMX","c":false,"w":"Incorrect. Response to a standard UTI antibiotic suggests a bacterial UTI, not TB."},{"t":"Pyuria with a negative routine bacterial urine culture","c":true,"w":"Correct. Sterile pyuria is classic, because M. tuberculosis does not grow on a routine culture."}],"take":"GU TB is the second most common extrapulmonary TB. Think of it with a TB history plus sterile pyuria, hematuria, and systemic symptoms."},{"topic":"GU Tuberculosis","unit":"Genitourinary","type":"mc","cj":"Take Action","stem":"The provider suspects genitourinary tuberculosis and orders urine cultures for acid-fast bacilli. How should the nurse collect the specimens?","opts":[{"t":"A single random specimen from a urine collection bag","c":false,"w":"Incorrect. One random specimen may miss intermittent shedding, and bag specimens are easily contaminated."},{"t":"One 24-hour urine collection kept on ice","c":false,"w":"Incorrect. A pooled 24-hour specimen is not preferred for AFB culture."},{"t":"A specimen obtained after the first dose of antitubercular drugs","c":false,"w":"Incorrect. Collect specimens before treatment starts to avoid false negatives."},{"t":"Three to five consecutive first-morning midstream urine specimens","c":true,"w":"Correct. First-morning specimens are the most concentrated, and several specimens improve detection because bacilli are shed intermittently."}],"take":"AFB urine cultures: several first-morning specimens, collected before treatment."},{"topic":"GU Tuberculosis","unit":"Genitourinary","type":"sata","cj":"Generate Solutions","stem":"A client with GU TB starts rifampin, isoniazid, pyrazinamide, and ethambutol. Which instructions should the nurse include? Select all that apply.","opts":[{"t":"Soft contact lenses are safe to wear during treatment","c":false,"w":"Incorrect. Rifampin can permanently stain soft contact lenses."},{"t":"Treatment continues for at least 6 months, even after symptoms improve","c":true,"w":"Correct. Long, uninterrupted therapy prevents relapse and drug resistance."},{"t":"Rifampin will turn urine, sweat, and tears reddish orange","c":true,"w":"Correct. This is expected and harmless."},{"t":"Report yellowing of the skin or eyes, or loss of appetite","c":true,"w":"Correct. Isoniazid, rifampin, and pyrazinamide are hepatotoxic."},{"t":"Avoid alcohol during treatment","c":true,"w":"Correct. Alcohol adds to the liver toxicity of these drugs."},{"t":"Report blurred vision or trouble telling red from green","c":true,"w":"Correct. Ethambutol can cause optic neuritis."},{"t":"Stop the medicines once a urine culture is negative for 1 week","c":false,"w":"Incorrect. Stopping early leads to relapse and resistance."}],"take":"TB drugs: long course, orange secretions with rifampin, liver toxicity, and vision changes with ethambutol."},{"topic":"GU Tuberculosis","unit":"Genitourinary","type":"mc","cj":"Analyze Cues","stem":"A client who completed treatment for genitourinary tuberculosis 2 years ago now reports dull left flank pain and decreased urine output. Imaging shows hydronephrosis. The nurse recognizes this is most likely caused by:","opts":[{"t":"Interstitial cystitis","c":false,"w":"Incorrect. IC causes bladder pain and frequency, not hydronephrosis."},{"t":"A ureteral stricture from scarring that obstructs urine flow","c":true,"w":"Correct. Scarring and ureteral strictures are the major long-term complications of GU TB. Obstruction backs urine up into the kidney (hydronephrosis)."},{"t":"Stress incontinence","c":false,"w":"Incorrect. Stress incontinence is leakage with increased abdominal pressure."},{"t":"A new episode of uncomplicated cystitis","c":false,"w":"Incorrect. Cystitis does not cause hydronephrosis or flank pain."}],"take":"Long-term complications of GU TB: scarring and ureteral strictures leading to obstruction."},{"topic":"Urinary Incontinence","unit":"Genitourinary","type":"sata","cj":"Analyze Cues","stem":"The nurse reviews the histories of several clients. Which clients are at risk for overflow incontinence? Select all that apply.","opts":[{"t":"A client with urinary retention after starting an anticholinergic medication","c":true,"w":"Correct. Anticholinergics relax the detrusor and can cause retention with overflow."},{"t":"A client with an overactive detrusor muscle after a stroke","c":false,"w":"Incorrect. Uncontrolled detrusor contractions cause urge incontinence."},{"t":"A woman who leaks urine when she sneezes or lifts groceries","c":false,"w":"Incorrect. Leakage with increased abdominal pressure is stress incontinence."},{"t":"A client with multiple sclerosis and a neurogenic bladder","c":true,"w":"Correct. Neurogenic bladder from MS, spinal cord injury, or spina bifida causes overflow."},{"t":"A client with dementia who cannot find the bathroom in time","c":false,"w":"Incorrect. Cognitive or environmental barriers cause functional incontinence."},{"t":"A 70-year-old man with benign prostatic hyperplasia and a weak urine stream","c":true,"w":"Correct. Bladder outlet obstruction from BPH causes retention and overflow."}],"take":"Overflow: the bladder overfills until pressure overcomes the sphincter. Causes are outlet obstruction or neurogenic bladder."},{"topic":"Urinary Incontinence","unit":"Genitourinary","type":"mc","cj":"Generate Solutions","stem":"A 58-year-old woman who has had three vaginal births reports leaking small amounts of urine when she coughs, laughs, or lifts her grandson. She denies urgency. Post-void residual is 30 mL. Which intervention is the best first-line choice?","opts":[{"t":"Teach intermittent self-catheterization","c":false,"w":"Incorrect. Self-catheterization treats overflow. Her residual is normal."},{"t":"Administer oxybutynin as prescribed","c":false,"w":"Incorrect. Anticholinergics treat urge incontinence."},{"t":"Restrict fluids to 1,000 mL/day","c":false,"w":"Incorrect. Fluid restriction concentrates urine, which irritates the bladder, and adds constipation and UTI risk."},{"t":"Teach pelvic floor muscle (Kegel) exercises","c":true,"w":"Correct. This is stress incontinence from weakened pelvic floor muscles. Kegel exercises are first-line."}],"take":"Stress incontinence: leakage with increased abdominal pressure. First-line treatment is Kegel exercises, then topical estrogen, pessary, or surgery."},{"topic":"Urinary Incontinence","unit":"Genitourinary","type":"sata","cj":"Evaluate Outcomes","stem":"The nurse teaches a client how to do pelvic floor (Kegel) exercises. Which client statements show correct understanding? Select all that apply.","opts":[{"t":"“I need to do these every day, and it may take several weeks to months to notice a difference.”","c":true,"w":"Correct. Results require consistent daily practice over weeks to months."},{"t":"“I hold each squeeze for up to 10 seconds, then relax for the same amount of time.”","c":true,"w":"Correct. A sustained contraction followed by equal relaxation builds strength."},{"t":"“I tighten the muscles I would use to stop urinating or hold back gas.”","c":true,"w":"Correct. This correctly identifies the pelvic floor muscles."},{"t":"“I should practice by stopping my urine stream every time I go to the bathroom.”","c":false,"w":"Incorrect. Stopping the stream is only used once to find the muscles. Doing it routinely can cause incomplete emptying."},{"t":"“I tighten my stomach and buttock muscles as hard as I can.”","c":false,"w":"Incorrect. Using the abdomen and buttocks means the wrong muscles are working and can raise abdominal pressure."}],"take":"Kegels: isolate the pelvic floor, hold and relax, repeat daily, and expect gradual improvement."},{"topic":"Urinary Incontinence","unit":"Genitourinary","type":"sata","cj":"Take Action","stem":"A 78-year-old client is prescribed oxybutynin for urge incontinence. Which assessments or teaching points should the nurse include? Select all that apply.","opts":[{"t":"Expect diarrhea during the first week","c":false,"w":"Incorrect. Constipation, not diarrhea, is expected."},{"t":"Expect a slow heart rate and increased saliva","c":false,"w":"Incorrect. These are cholinergic effects, seen with bethanechol. Anticholinergics cause tachycardia and dry mouth."},{"t":"Use sugar-free gum or hard candy for dry mouth","c":true,"w":"Correct. Dry mouth is the most common anticholinergic effect."},{"t":"Report difficulty emptying the bladder","c":true,"w":"Correct. Urinary retention is an anticholinergic effect."},{"t":"Report new confusion or memory problems","c":true,"w":"Correct. Anticholinergics can cause confusion in older adults. They are on the Beers list."},{"t":"Increase fiber and fluids to prevent constipation","c":true,"w":"Correct. Anticholinergics slow GI motility."},{"t":"Ask about a history of narrow-angle glaucoma","c":true,"w":"Correct. Anticholinergics can raise intraocular pressure and are contraindicated in narrow-angle glaucoma."}],"take":"Anticholinergic effects: can't see (blurred vision), can't pee (retention), can't spit (dry mouth), can't poop (constipation), plus confusion in older adults."},{"topic":"Urinary Incontinence","unit":"Genitourinary","type":"mc","cj":"Recognize Cues","stem":"A client with overflow incontinence from a neurogenic bladder received bethanechol 1 hour ago. Which finding requires immediate action?","opts":[{"t":"Mild increase in saliva","c":false,"w":"Incorrect. This is an expected minor cholinergic effect."},{"t":"Reports an urge to urinate","c":false,"w":"Incorrect. This is expected as bladder contraction improves."},{"t":"Heart rate 48/min and BP 86/50 mm Hg","c":true,"w":"Correct. Bethanechol is a cholinergic drug. Bradycardia and hypotension are serious cholinergic effects; hold further doses and report."},{"t":"Voided 350 mL of clear yellow urine","c":false,"w":"Incorrect. This is the intended effect: improved bladder emptying."}],"take":"Bethanechol (cholinergic): watch for bradycardia, hypotension, sweating, salivation, and cramping. It is contraindicated with mechanical obstruction."},{"topic":"Urinary Incontinence","unit":"Genitourinary","type":"sata","cj":"Generate Solutions","stem":"A resident with moderate Alzheimer's disease in a memory care unit is found wet several times a day. She walks with a walker and voids when she is taken to the bathroom. Which interventions should the nurse include in her plan of care? Select all that apply.","opts":[{"t":"Clothing with elastic waistbands or hook-and-loop closures","c":true,"w":"Correct. Easy-to-remove clothing removes a barrier to toileting in time."},{"t":"Prompted, scheduled toileting at regular intervals while awake","c":true,"w":"Correct. Scheduled or prompted voiding is the main strategy for functional incontinence."},{"t":"Limiting fluids after breakfast to reduce episodes","c":false,"w":"Incorrect. Fluid restriction causes dehydration, concentrated urine, and UTI risk. At most, limit fluids in the 2 hours before bed."},{"t":"A picture sign on the bathroom door and a clear, well-lit path","c":true,"w":"Correct. Environmental cues and access help when cognition and mobility are the barriers."},{"t":"An indwelling catheter to keep her dry","c":false,"w":"Incorrect. Catheters greatly increase UTI risk and are a last resort, not a first-line strategy."},{"t":"Checking for a UTI if incontinence or confusion suddenly worsens","c":true,"w":"Correct. Always rule out UTI as a reversible cause of a sudden change."}],"take":"Functional incontinence: treat reversible causes, schedule toileting, improve access, and use containment last while protecting the skin."},{"topic":"Urinary Incontinence","unit":"Genitourinary","type":"mc","cj":"Prioritize Hypotheses","stem":"A 74-year-old client who had a stroke last year says, “When I have to go, I have to go right now,” and often leaks before reaching the bathroom. She voids 12 to 14 times a day. Post-void residual is 40 mL and urinalysis is negative. Which type of incontinence and initial intervention are most appropriate?","opts":[{"t":"Urge incontinence; bladder training with gradually longer voiding intervals","c":true,"w":"Correct. A sudden strong urge, frequency, a normal residual, and neurologic history point to urge incontinence (overactive bladder). Bladder training is a first-line intervention."},{"t":"Overflow incontinence; intermittent catheterization","c":false,"w":"Incorrect. Her residual is normal, so she empties her bladder."},{"t":"Functional incontinence; incontinence briefs only","c":false,"w":"Incorrect. Nothing suggests a cognitive or mobility barrier, and containment alone does not treat the cause."},{"t":"Stress incontinence; a pessary","c":false,"w":"Incorrect. She leaks with urgency, not with coughing or lifting."}],"take":"Urge: sudden strong need, then leakage, voiding more often than every 2 hours. Treat with bladder training, Kegels, anticholinergics, or mirabegron."},{"topic":"Urinary Incontinence","unit":"Genitourinary","type":"sata","cj":"Generate Solutions","stem":"The nurse is teaching a bladder training program to a client with urge incontinence. Which instructions should the nurse include? Select all that apply.","opts":[{"t":"Void on a fixed schedule, then lengthen the interval by 15 to 30 minutes as you succeed","c":true,"w":"Correct. Gradually lengthening the interval retrains the bladder to hold more."},{"t":"When an urge comes early, stand still and do several quick pelvic floor squeezes until it passes","c":true,"w":"Correct. Urge suppression calms detrusor contractions."},{"t":"Restrict fluids to less than 1,000 mL/day","c":false,"w":"Incorrect. Concentrated urine irritates the bladder and worsens urgency."},{"t":"Drink most of your fluids in the evening","c":false,"w":"Incorrect. This increases nocturia. Spread fluids across the day and taper them before bed."},{"t":"Go to the bathroom as soon as you feel any urge","c":false,"w":"Incorrect. Voiding with every urge reinforces a small bladder capacity."},{"t":"Limit caffeine and alcohol","c":true,"w":"Correct. Both irritate the bladder and worsen urgency."},{"t":"Keep a diary of voiding times, leakage episodes, and fluid intake","c":true,"w":"Correct. The diary sets the starting interval and tracks progress."}],"take":"Bladder training: diary, scheduled voiding, gradual lengthening, urge suppression, and fewer irritants."},{"topic":"Urinary Incontinence","unit":"Genitourinary","type":"mc","cj":"Recognize Cues","stem":"A client with urge incontinence is started on mirabegron. Which assessment should the nurse monitor most closely?","opts":[{"t":"Respiratory rate","c":false,"w":"Incorrect. Respiratory depression is not an expected effect."},{"t":"Serum calcium","c":false,"w":"Incorrect. Mirabegron does not affect calcium."},{"t":"Blood pressure","c":true,"w":"Correct. Mirabegron is a beta-3 agonist that can raise blood pressure. Monitor BP, especially in clients with hypertension."},{"t":"Blood glucose","c":false,"w":"Incorrect. Mirabegron does not significantly affect glucose."}],"take":"Urge incontinence drugs: anticholinergics (watch anticholinergic effects) and mirabegron (watch BP)."},{"topic":"Urinary Incontinence","unit":"Genitourinary","type":"sata","cj":"Take Action","stem":"A client with multiple sclerosis has overflow incontinence from a neurogenic bladder. Which interventions are appropriate? Select all that apply.","opts":[{"t":"Give oxybutynin as prescribed","c":false,"w":"Incorrect. Oxybutynin relaxes the detrusor and would worsen retention."},{"t":"Teach clean intermittent self-catheterization","c":true,"w":"Correct. Intermittent catheterization empties the bladder and prevents overdistention."},{"t":"Give bethanechol as prescribed","c":true,"w":"Correct. Bethanechol enhances bladder contraction to promote emptying."},{"t":"Restrict fluids to 800 mL/day","c":false,"w":"Incorrect. Fluid restriction concentrates urine and raises UTI risk."},{"t":"Teach double voiding (void, wait a few minutes, then void again)","c":true,"w":"Correct. Double voiding improves emptying."},{"t":"Monitor post-void residual with a bladder scanner","c":true,"w":"Correct. Residual volumes show how well the bladder empties and guide catheterization."}],"take":"Overflow: get the bladder empty. Use intermittent catheterization, double voiding, bethanechol, and treat obstruction."},{"topic":"Urosepsis","unit":"Genitourinary","type":"mc","cj":"Prioritize Hypotheses","stem":"The nurse receives report on four clients. Which client should the nurse see first?","opts":[{"t":"A client with pyelonephritis who has a temperature of 101.6°F (38.7°C), HR 118/min, BP 88/52 mm Hg, and new confusion","c":true,"w":"Correct. Hypotension, tachycardia, fever, and altered mental status suggest urosepsis progressing toward septic shock, which is life threatening."},{"t":"A client with interstitial cystitis who is voiding every hour","c":false,"w":"Incorrect. This is consistent with the chronic condition and stable."},{"t":"A client with cystitis who rates burning on urination 5/10","c":false,"w":"Incorrect. This needs comfort measures but is stable and expected."},{"t":"A client taking phenazopyridine who reports orange urine","c":false,"w":"Incorrect. This is an expected drug effect."}],"take":"Urosepsis is the life-threatening complication of UTI. Hypotension and new confusion move a client to the top of the list."},{"topic":"Urosepsis","unit":"Genitourinary","type":"sata","cj":"Recognize Cues","stem":"A client has had an indwelling urinary catheter for 6 days. Which findings would the nurse recognize as possible signs of urosepsis? Select all that apply.","opts":[{"t":"Respiratory rate 26/min","c":true,"w":"Correct. Tachypnea above 20/min is a sepsis criterion."},{"t":"Temperature 96.2°F (35.7°C)","c":true,"w":"Correct. Hypothermia (below 96.8°F or 36°C) is a sepsis criterion, just like fever. Older adults especially may present this way."},{"t":"Serum lactate 3.2 mmol/L","c":true,"w":"Correct. Lactate above 2 mmol/L indicates tissue hypoperfusion."},{"t":"Urine output 60 mL/hr","c":false,"w":"Incorrect. This is adequate output. Sepsis would more likely cause output below 30 mL/hr."},{"t":"Heart rate 112/min","c":true,"w":"Correct. Tachycardia above 90/min is a sepsis criterion."},{"t":"New-onset confusion","c":true,"w":"Correct. Altered mentation reflects decreased cerebral perfusion."}],"take":"Sepsis cues: temperature that is high or low, HR above 90, RR above 20, confusion, rising lactate, and falling urine output."},{"topic":"Urosepsis","unit":"Genitourinary","type":"sata","cj":"Take Action","stem":"A client with suspected urosepsis has BP 82/48 mm Hg and a serum lactate of 4.4 mmol/L. Which actions should the nurse anticipate within the first hour? Select all that apply.","opts":[{"t":"Repeat the lactate level if the first is elevated","c":true,"w":"Correct. Trending lactate shows whether perfusion is improving."},{"t":"Hold antibiotics until culture results identify the organism","c":false,"w":"Incorrect. Culture results take 24 to 72 hours. Waiting would be dangerous."},{"t":"Administer IV furosemide to increase urine output","c":false,"w":"Incorrect. The client is hypovolemic and hypotensive. A diuretic would worsen perfusion."},{"t":"Obtain blood cultures before antibiotics are started","c":true,"w":"Correct. Cultures come first, but they must not delay antibiotics."},{"t":"Infuse 30 mL/kg of IV crystalloid","c":true,"w":"Correct. This is indicated for hypotension or a lactate of 4 mmol/L or higher."},{"t":"Monitor urine output hourly","c":true,"w":"Correct. Hourly output is a key indicator of organ perfusion."},{"t":"Administer broad-spectrum IV antibiotics","c":true,"w":"Correct. Every hour of delay in antibiotics increases mortality."}],"take":"Hour-1 sepsis bundle: lactate, blood cultures, broad-spectrum antibiotics, 30 mL/kg crystalloid, and vasopressors if hypotension persists."},{"topic":"Urosepsis","unit":"Genitourinary","type":"sata","cj":"Generate Solutions","stem":"Which nursing actions reduce the risk of catheter-associated UTI (CAUTI) and urosepsis? Select all that apply.","opts":[{"t":"Keep the drainage bag below the level of the bladder and off the floor","c":true,"w":"Correct. This prevents backflow and contamination."},{"t":"Disconnect the catheter from the tubing to collect a urine specimen","c":false,"w":"Incorrect. Collect specimens from the sampling port with sterile technique to keep the system closed."},{"t":"Assess every day whether the indwelling catheter is still needed","c":true,"w":"Correct. Duration is the biggest risk factor, so remove the catheter as soon as possible."},{"t":"Irrigate the catheter routinely every shift","c":false,"w":"Incorrect. Routine irrigation opens the system and increases infection risk."},{"t":"Replace the catheter every 72 hours","c":false,"w":"Incorrect. Routine changes on a fixed schedule are not recommended."},{"t":"Maintain a closed drainage system","c":true,"w":"Correct. Breaking the system lets bacteria in."},{"t":"Clean the perineum and catheter at the meatus with soap and water","c":true,"w":"Correct. Routine hygiene reduces bacteria near the insertion site."}],"take":"CAUTI prevention: remove the catheter early, keep a closed system, keep the bag low and off the floor, and provide daily hygiene."},{"topic":"Urosepsis","unit":"Genitourinary","type":"mc","cj":"Take Action","stem":"A client with urosepsis has received 30 mL/kg of IV crystalloid. The mean arterial pressure (MAP) remains 58 mm Hg. Which prescription should the nurse anticipate next?","opts":[{"t":"Norepinephrine infusion titrated to a MAP of 65 mm Hg or higher","c":true,"w":"Correct. Hypotension that persists after fluid resuscitation is septic shock and requires vasopressors."},{"t":"Phenazopyridine 200 mg orally","c":false,"w":"Incorrect. This is a urinary analgesic and does nothing for shock."},{"t":"Restrict IV fluids to keep the vein open","c":false,"w":"Incorrect. The client still needs perfusion support."},{"t":"Furosemide 40 mg IV push","c":false,"w":"Incorrect. A diuretic would worsen hypotension and perfusion."}],"take":"Septic shock: hypotension despite adequate fluids. The goal is a MAP of 65 mm Hg or higher with vasopressors."},{"topic":"Pediatric UTI","unit":"Pediatric GU","type":"sata","cj":"Recognize Cues","stem":"A 4-month-old infant is brought to the clinic. The provider suspects a urinary tract infection. Which findings would the nurse expect in an infant this age? Select all that apply.","opts":[{"t":"Vomiting","c":true,"w":"Correct. GI symptoms are common in infant UTI."},{"t":"Foul-smelling urine","c":true,"w":"Correct. Foul-smelling urine can be noticed in the diaper."},{"t":"Poor feeding","c":true,"w":"Correct. Infants show nonspecific signs such as poor feeding."},{"t":"Localized complaints of flank pain","c":false,"w":"Incorrect. Infants cannot localize or describe pain. Localized complaints appear in older children."},{"t":"Irritability","c":true,"w":"Correct. Irritability is a nonspecific but common sign."},{"t":"Fever","c":true,"w":"Correct. Fever is often the main sign of UTI in infants."},{"t":"Bulging anterior fontanel","c":false,"w":"Incorrect. A bulging fontanel suggests increased intracranial pressure or meningitis, not UTI."}],"take":"Infant UTI signs are nonspecific: fever, poor feeding, vomiting, irritability, poor weight gain. Classic dysuria and frequency appear in older children."},{"topic":"Pediatric UTI","unit":"Pediatric GU","type":"mc","cj":"Take Action","stem":"A urine culture is prescribed for a 9-month-old infant with fever and suspected UTI. Which collection method is most reliable?","opts":[{"t":"A clean-catch midstream specimen","c":false,"w":"Incorrect. An infant cannot void on command, so a clean catch is not possible."},{"t":"Cotton balls placed in the diaper and squeezed into a cup","c":false,"w":"Incorrect. This is highly contaminated and not acceptable for culture."},{"t":"Sterile urinary catheterization","c":true,"w":"Correct. Catheterization (or suprapubic aspiration) gives an uncontaminated specimen in a child who is not toilet trained."},{"t":"An adhesive urine collection bag applied to the perineum","c":false,"w":"Incorrect. Bag specimens are frequently contaminated by skin and stool flora and are unreliable for culture."}],"take":"Culture in a child who is not toilet trained: catheterize or use suprapubic aspiration. Bags are for screening at most."},{"topic":"Pediatric UTI","unit":"Pediatric GU","type":"sata","cj":"Generate Solutions","stem":"The nurse is teaching the parents of a 6-year-old girl who has had recurrent UTIs. Which instructions should the nurse include? Select all that apply.","opts":[{"t":"Use cranberry juice instead of finishing the antibiotic once she feels better","c":false,"w":"Incorrect. The full antibiotic course must be completed to clear the infection and protect the kidneys."},{"t":"Limit fluids so she does not need the bathroom at school","c":false,"w":"Incorrect. Increased fluid intake is encouraged to flush bacteria."},{"t":"Teach her to wipe from front to back","c":true,"w":"Correct. Fecal bac
